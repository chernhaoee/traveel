<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Traveel</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Traveel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}[hidden]{display:none!important}img{max-width:100%}code{font-size:.95em}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: one-column phone app. Sticky header, scrolling screen, fixed bottom tab bar. Accent (user-picked) only on lines, borders, active states. */
:root{
  --bg:#ffffff; --surface:#ffffff; --fill:#f4f4f5; --line:#e6e6e9; --fg:#18181b; --muted:#6c6c75; --faint:#9a9aa3;
  --good:#1a7f4b; --bad:#c0392b;
  --accent:#e0475b; --on-accent:#ffffff;
  --accent-soft:color-mix(in srgb, var(--accent) 12%, transparent);
  --accent-line:color-mix(in srgb, var(--accent) 55%, var(--line));
  --font:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#202124; --surface:#28292c; --fill:#2e2f33; --line:#3a3b40; --fg:#ececee; --muted:#a3a3ab; --faint:#7d7d86;
  --good:#4cc38a; --bad:#ff7a6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#202124; --surface:#28292c; --fill:#2e2f33; --line:#3a3b40; --fg:#ececee; --muted:#a3a3ab; --faint:#7d7d86;
  --good:#4cc38a; --bad:#ff7a6b; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--accent-line);color:var(--fg);background:transparent;white-space:nowrap}
.chip.soft{border-color:var(--line);color:var(--muted)}
.sthumb{flex:none;width:44px;height:44px;border-radius:10px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--fill);cursor:zoom-in}
.sthumb img{width:100%;height:100%;object-fit:cover;display:block}
.fcbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--fill);margin:10px 0 6px}
.fcbar i{display:block;height:100%}
.fclegend{display:flex;flex-wrap:wrap;gap:4px 12px}.fclegend b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid3 .f{margin:0}.grid3 input{width:100%;min-width:0}
.forchip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--fill);border:1px solid var(--line);color:var(--muted)}
.it.other{opacity:.55}
.mvp{background:linear-gradient(145deg,#1b1530,#2e1a3f 55%,#41203b);color:#f5f1ff;border:1px solid #5b3d6b;border-radius:18px;padding:16px;margin-bottom:16px;overflow:hidden}
.mvp h3{color:#f3c969;letter-spacing:.14em;margin:0 0 2px}
.mvp .sub{color:#c9bde0;font-size:13px}
.mvp .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mvp .aw{background:rgba(255,255,255,.06);border:1px solid rgba(243,201,105,.25);border-radius:14px;padding:12px 10px;text-align:center;opacity:0;transform:translateY(8px);animation:awIn .5s ease forwards}
.mvp .aw .em{font-size:30px;line-height:1.1}
.mvp .aw .t{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#f3c969;margin-top:6px}
.mvp .aw .n{font-size:17px;font-weight:800;margin-top:4px;color:#fff}
.mvp .aw .l{font-size:12px;color:#c9bde0;margin-top:2px}
.mvp .aw.top{grid-column:1/-1;background:linear-gradient(135deg,rgba(243,201,105,.22),rgba(243,201,105,.06));border-color:rgba(243,201,105,.6)}
.mvp .aw.wide{grid-column:1/-1}
.mvp .aw.top .em{font-size:40px}.mvp .aw.top .n{font-size:22px}
.mvp .btn{border-color:#f3c969;color:#f3c969;background:transparent}
.mvp .btn.primary{background:#f3c969;color:#1b1530}
@keyframes awIn{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.mvp .aw{animation:none;opacity:1;transform:none}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:16px;display:flex;flex-direction:column;gap:18px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-block:6px}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--faint);cursor:pointer;border-radius:10px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{margin:0;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent-line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.plain{border-color:var(--line)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
.linkchip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.linkchip:hover{border-color:var(--accent-line);color:var(--fg)}
.banner{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px}
.section{display:flex;flex-direction:column;gap:10px}
/* day strip */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin-inline:-2px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:54px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 8px;text-align:center;cursor:pointer}
.day b{display:block;font-size:17px;line-height:1.1}
.day span{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.day[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dayhead{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--muted)}
details.dn{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
details.dn summary{cursor:pointer;font-weight:600;font-size:14px}
details.dn ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
/* timeline */
.tl{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:62px 1fr;gap:12px;text-align:left;background:none;border:0;padding:0;width:100%;cursor:default}
.it.edit{cursor:pointer}
.it .t{font-size:12.5px;font-weight:600;color:var(--muted);padding-top:12px;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.it .b{border-left:2px solid var(--accent-line);padding:10px 0 14px 14px;position:relative;min-width:0}
.it .b::before{content:"";position:absolute;left:-6px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.it .ti{font-weight:600;font-size:15px}
.edhint{float:right;margin-left:8px;display:inline-flex;color:var(--faint);padding:2px}
.it.edit:hover .edhint{color:var(--accent)}
.it .no{font-size:13.5px;color:var(--muted);margin-top:2px}
.it .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.star{font-size:12px;font-weight:600;color:var(--good);border:1px solid color-mix(in srgb,var(--good) 40%,transparent);border-radius:999px;padding:2px 8px}
/* spend */
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li.tap{cursor:pointer}
.li .main{flex:1;min-width:0}
.li .ti{font-weight:600}
.li .sub{font-size:12.5px;color:var(--muted)}
.li .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.li .amt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.tag{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 6px;border:1px solid var(--accent-line);color:var(--fg)}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.grouphead{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;border-bottom:1px solid var(--accent-line);padding-bottom:4px}
/* todo */
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:0 0 auto}
.task .main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.task.done .ti{text-decoration:line-through;color:var(--faint)}
.task .ti{font-weight:600;font-size:14.5px}
.task .sub{font-size:13px;color:var(--muted)}
.due{font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;border:1px solid var(--line);border-radius:6px;padding:1px 6px;align-self:flex-start;margin-top:2px}
/* notes */
.audit{max-height:240px;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.audit .arow{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.35}
.audit .arow:last-child{border-bottom:0}
.audit .atext{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.audit .atime{font-size:12px;color:var(--muted);white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:7px 8px;border-radius:7px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent-line)}
details.note{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.note[open]{border-color:var(--accent-line)}
details.note summary{cursor:pointer;padding:12px 14px;font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
details.note summary::-webkit-details-marker{display:none}
details.note summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.note[open] summary::after{transform:rotate(-135deg)}
details.note ul{margin:0;padding:0 14px 6px 32px;display:flex;flex-direction:column;gap:8px;font-size:14px}
details.note .ed{padding:0 14px 12px}
/* trip */
.qr{background:#fff;padding:10px;border-radius:10px;width:max-content;max-width:100%;border:1px solid var(--line)}
.qr img,.qr canvas{display:block;max-width:100%}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px;cursor:pointer}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
/* sheet */
.sheet{position:fixed;inset:0;bottom:var(--kb,0px);z-index:50;transition:bottom .15s ease;display:flex;align-items:flex-end;justify-content:center;background:color-mix(in srgb,#000 45%,transparent)}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:min(90%,calc(var(--vvh,100dvh) - 24px));overflow:auto;border-radius:18px 18px 0 0;border-top:2px solid var(--accent);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.panel .ph{display:flex;align-items:center;gap:10px}
.panel .ph h2{font-size:18px;flex:1}
.x{border:0;background:var(--fill);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.f{display:flex;flex-direction:column;gap:5px}
.f label,.lab{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input:not([type=checkbox]),.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none}
.f textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.pick button[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.hint{font-size:12.5px;color:var(--muted)}
.res{display:flex;flex-direction:column;gap:8px}
.res .card{display:flex;flex-direction:column;gap:6px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1 id="tripName">Traveel</h1><p id="tripSub"></p></div>
  <button class="chip" id="roleChip" type="button" title="Your account" style="cursor:pointer;font:inherit">Loading</button>
</div></header>

<canvas id="fx" aria-hidden="true"></canvas>
<main><div class="wrap" id="screen"></div></main>

<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-tab="spend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l5 7 5-7M12 11v9M8 13h8M8 16.5h8"/></svg>Spend</button>
  <button data-tab="todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 12l3 3 5-6"/></svg>Lists</button>
  <button data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9 15.5H3z"/><path d="M12 10v4M12 16.8v.2"/></svg>Notes</button>
  <button data-tab="trip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9.5" r="2.5"/><path d="M16 14.2c2.5 0 4.1 1.6 4.6 4.3"/></svg>Trip</button>
</div></nav>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script type="module">
import { FIREBASE_CONFIG } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, query, orderBy, limit, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const SHARE_URL = location.origin + location.pathname;
const CONFIGURED = FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && !String(FIREBASE_CONFIG.apiKey).startsWith("PASTE");
let app=null, auth=null, fs=null;
if(CONFIGURED){
  app = initializeApp(FIREBASE_CONFIG);
  auth = getAuth(app);
  try{ fs = initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})}); }
  catch(e){ fs = initializeFirestore(app,{}); }
}
// Small adapter so the rest of the app talks to Firestore the same way everywhere.
function mkDb(){
  const q=(path,cons=[])=>({
    orderBy(f,dir){ return q(path,[...cons,orderBy(f,dir||"asc")]); },
    limit(n){ return q(path,[...cons,limit(n)]); },
    onSnapshot(next,err){ const ref=cons.length?query(collection(fs,path),...cons):collection(fs,path);
      return onSnapshot(ref,snap=>next({docs:snap.docs.map(d=>({id:d.id,exists:true,data:()=>d.data()}))}),e=>{ console.warn(path,e); err&&err(e); }); },
    add(data){ return addDoc(collection(fs,path),data); },
    doc(id){ return dref(path+"/"+id); }
  });
  const dref=p=>({ set:d=>setDoc(doc(fs,p),d), update:d=>updateDoc(doc(fs,p),d), delete:()=>deleteDoc(doc(fs,p)),
    get:async()=>{ const sn=await getDoc(doc(fs,p)); return {id:sn.id,exists:sn.exists(),data:()=>sn.data()}; } });
  return { collection:p=>q(p), doc:dref };
}

function fxFrame(t){
  const c=$("#fx"); if(!c||FX.kind==="off") return; const g=c.getContext("2d");
  const dt=Math.min(3,FX.last?(t-FX.last)/16.7:1); FX.last=t;
  const dark=document.documentElement.dataset.theme==="dark"||(document.documentElement.dataset.theme!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);
  g.setTransform(FX.dpr,0,0,FX.dpr,0,0); g.clearRect(0,0,FX.w,FX.h);
  g.globalAlpha=dark?.4:.5;
  for(const p of FX.parts){
    p.ph+=.02*dt; p.y+=p.vy*dt; p.x+=(p.vx+Math.sin(p.ph)*p.sw*.35)*dt; p.rot+=p.vr*dt;
    if(p.y>FX.h+30||p.x>FX.w+40||p.x<-40) Object.assign(p,fxNew(true));
    g.save(); g.translate(p.x,p.y);
    if(FX.kind==="snow"){ g.fillStyle=dark?"#ffffff":"#9fb4c8"; g.globalAlpha=dark?.55:.45; g.beginPath(); g.arc(0,0,p.s,0,6.28); g.fill(); }
    else { p.flip+=p.vf*dt; g.rotate(p.rot); if(p.vf) g.scale(.35+.65*Math.abs(Math.cos(p.flip)),1); g.drawImage(p.img,-p.s/2,-p.s/2,p.s,p.s); }
    g.restore();
  }
  FX.raf=requestAnimationFrame(fxFrame);
}
function fxStart(){
  cancelAnimationFrame(FX.raf); FX.last=0; FX.kind=fxKind(); const c=$("#fx"); if(!c) return;
  fxResize(); const g=c.getContext("2d"); g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,c.width,c.height);
  if(FX.kind==="off"){ FX.parts=[]; return; }
  const n=Math.round(Math.min(60,Math.max(FX.kind==="daruma"?10:18,FX.w*FX.h/(FX.kind==="snow"?9000:FX.kind==="daruma"?30000:16000))));
  FX.parts=Array.from({length:n},()=>fxNew(false)); FX.raf=requestAnimationFrame(fxFrame);
}

document.addEventListener("visibilitychange",()=>{ if(document.hidden) cancelAnimationFrame(FX.raf); else if(FX.kind!=="off"){ FX.last=0; FX.raf=requestAnimationFrame(fxFrame); } });
function applyTheme(){
  const t=ls.get("theme","system"), root=document.documentElement;
  if(t==="system") delete root.dataset.theme; else root.dataset.theme=t;
  const a=ls.get("accent",PRESETS[0]);
  root.style.setProperty("--accent",a);
  const h=a.replace("#",""); const [r,g,b]=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255).map(c=>c<=.03928?c/12.92:((c+.055)/1.055)**2.4);
  const L=.2126*r+.7152*g+.0722*b;
  root.style.setProperty("--on-accent", L>.42?"#111111":"#ffffff");
}

async function fetchLiveRate(){
  try{ const r=await fetch("https://api.frankfurter.app/latest?from=JPY&to=MYR"); const j=await r.json(); if(j&&j.rates&&j.rates.MYR) return {rate100:j.rates.MYR*100,source:"ECB via Frankfurter ("+j.date+")",date:j.date}; }catch(e){}
  try{ const r=await fetch("https://open.er-api.com/v6/latest/JPY"); const j=await r.json(); if(j&&j.rates&&j.rates.MYR) return {rate100:j.rates.MYR*100,source:"open.er-api.com",date:todayJST()}; }catch(e){}
  return null;
}
function rateFor(date){
  if(S.rates[date]) return {...S.rates[date],date,exact:true};
  const ds=Object.keys(S.rates).filter(d=>d<=date).sort(); const any=Object.keys(S.rates).sort();
  const k=ds.length?ds[ds.length-1]:any[any.length-1];
  if(k) return {...S.rates[k],date:k,exact:false};
  return S.liveRate?{...S.liveRate,exact:false,live:true}:null;
}
const isRM = e => e.cur==="MYR";
function est(e){ if(isRM(e)) return e.rm||0; return e.rate100? e.yen*e.rate100/100 : null }
function yenEq(e){ if(!isRM(e)) return e.yen||0; const r=e.rate100||(rateFor(e.date)||{}).rate100; return r?(e.rm||0)/r*100:0; }
const yenKnown = e => !isRM(e) || !!(e.rate100||(rateFor(e.date)||{}).rate100);
const amtLabel = e => isRM(e)?rm(e.rm||0):yen(e.yen||0);
const splitOf = e => (e.split&&e.split.length?e.split:S.people.map(p=>p.id));
function rmOf(e){ let b=basis(e); if(b==null){ const r=(rateFor(e.date)||{}).rate100; if(r) b=(e.yen||0)*r/100; } return b; }
// What this expense costs one person. A treat is all on whoever paid; everyone else pays nothing.
const eachPaid = e => !!e.each; // split evenly, and everyone paid their own part: nobody owes anybody
function shareFor(e,pid){ const n=splitOf(e).length||1;
  if(e.treat) return e.paidBy===pid?{f:1,n}:{f:0,n};
  return splitOf(e).includes(pid)?{f:1/n,n}:{f:0,n}; }
function basis(e){ if(isRM(e)) return e.rm||0; if(e.method==="card"&&e.bank>0) return e.bank; return est(e) }
function totals(){
  let y=0,myr=0,myrN=0,estSum=0,missing=0,bank=0,bankEst=0,bankN=0,cardN=0,actual=0;
  for(const e of S.expenses){
    if(isRM(e)){ myr+=e.rm||0; myrN++; estSum+=e.rm||0; actual+=e.rm||0; continue; }
    y+=e.yen||0; const v=est(e); if(v==null) missing++; else estSum+=v;
    const b=basis(e); if(b!=null) actual+=b;
    if(e.method==="card"){cardN++; if(e.bank>0&&v!=null){bank+=e.bank;bankEst+=v;bankN++}}
  }
  return {y,myr,myrN,estSum,missing,bank,bankEst,bankN,cardN,actual};
}
function balances(){
  const net={}; S.people.forEach(p=>net[p.id]=0);
  for(const e of S.expenses){
    const v=basis(e); if(v==null||!e.paidBy||e.treat||eachPaid(e)) continue;
    const split=(e.split&&e.split.length?e.split:S.people.map(p=>p.id)).filter(id=>id in net);
    if(!split.length) continue;
    if(e.paidBy in net) net[e.paidBy]+=v;
    split.forEach(id=>net[id]-=v/split.length);
  }
  const cred=[],debt=[];
  for(const [id,v] of Object.entries(net)){ if(v>0.005) cred.push([id,v]); else if(v<-0.005) debt.push([id,-v]); }
  cred.sort((a,b)=>b[1]-a[1]); debt.sort((a,b)=>b[1]-a[1]);
  const moves=[]; let i=0,j=0;
  while(i<debt.length&&j<cred.length){ const m=Math.min(debt[i][1],cred[j][1]); moves.push([debt[i][0],cred[j][0],m]); debt[i][1]-=m; cred[j][1]-=m; if(debt[i][1]<0.005)i++; if(cred[j][1]<0.005)j++; }
  return {net,moves};
}
function myDebts(){ // exact pairwise, from expenses I'm in (all of which I can see)
  const me=myPerson(); if(!me) return []; const pair={};
  for(const e of S.expenses){ const v=basis(e); if(v==null||!e.paidBy||e.treat||eachPaid(e)) continue;
    const split=(e.split&&e.split.length?e.split:S.people.map(p=>p.id)); const sh=v/split.length;
    if(e.paidBy===me.id) split.forEach(id=>{ if(id!==me.id) pair[id]=(pair[id]||0)+sh; });
    else if(split.includes(me.id)) pair[e.paidBy]=(pair[e.paidBy]||0)-sh; }
  return Object.entries(pair).filter(([,v])=>Math.abs(v)>0.005).sort((a,b)=>b[1]-a[1]);
}

async function computeAwards(){
  let audit=[]; try{ const sn=await getDocs(collection(fs,"audit")); audit=sn.docs.map(d=>d.data()); }catch(e){ audit=S.audit||[]; }
  const pidOf=uid=>(S.members.find(m=>m.id===uid)||{}).personId;
  const P=S.people.map(p=>p.id); const st={}; P.forEach(id=>st[id]={spend:0,treatOut:0,treatIn:0,food:0,shop:0,front:0,logged:0,plan:0,acts:0,tix:0,cash:0});
  for(const e of S.expenses){ const b=rmOf(e); if(b==null) continue; const sp=splitOf(e), n=sp.length||1;
    P.forEach(id=>{ const {f}=shareFor(e,id); if(!f) return; st[id].spend+=b*f; if(e.cat==="Food") st[id].food+=b*f; if(e.cat==="Shopping") st[id].shop+=b*f; });
    if(eachPaid(e)) sp.forEach(id=>{ if(id in st) st[id].front+=b/n; });
    else if(e.paidBy in st){ st[e.paidBy].front+=b; if(e.method==="cash"&&!isRM(e)) st[e.paidBy].cash++; }
    if(e.treat&&e.paidBy in st){ sp.forEach(id=>{ if(id!==e.paidBy&&id in st){ st[e.paidBy].treatOut+=b/n; st[id].treatIn+=b/n; } }); }
    const ap=pidOf(e.by); if(ap in st) st[ap].logged++; }
  for(const a of audit){ const id=pidOf(a.uid); if(!(id in st)) continue; st[id].acts++;
    if(/stop|day|note|to-do|task|import/i.test(a.a||"")) st[id].plan++; }
  for(const w of S.wallet){ const id=pidOf(w.by); if(id in st) st[id].tix++; }
  const linked=P.filter(id=>S.members.some(m=>m.personId===id));
  const won={}; const CAP=2; // spread the love: once someone has 2 awards, the next one they'd win is skipped
  const best=(k,min)=>{ const ok=P.filter(id=>st[id][k]>(min||0)).sort((a,b)=>st[b][k]-st[a][k]); return ok[0]&&(won[ok[0]]||0)<CAP?ok[0]:null; }; // the real winner or nobody, so the numbers never lie
  const list=[]; const add=(key,emoji,title,pid,line)=>{ if(pid){ list.push({key,emoji,title,pid,line}); won[pid]=(won[pid]||0)+1; } };
  add("spender","💸","The Top Spender",best("spend"),pid=>`spent ${rm(st[pid].spend)}`);
  add("heart","🎁","The Big Heart",best("treatOut",0.5),pid=>`treated everyone to ${rm(st[pid].treatOut)}`);
  add("bank","🏦","The Group Bank",best("front",0.5),pid=>`fronted ${rm(st[pid].front)} for the group`);
  add("foodie","🍜","The Foodie",best("food",0.5),pid=>`ate through ${rm(st[pid].food)}`);
  add("shop","🛍️","The Shopaholic",best("shop",0.5),pid=>`shopped ${rm(st[pid].shop)}`);
  add("planner","🗺️","The Full Planner",best("plan"),pid=>`${st[pid].plan} changes to the plan`);
  add("accountant","🧾","The Accountant",best("logged"),pid=>`logged ${st[pid].logged} expenses`);
  add("tix","🎟️","The Ticket Master",best("tix"),pid=>`uploaded ${st[pid].tix} tickets`);
  add("cash","💴","The Cash King",best("cash",1),pid=>`paid cash ${st[pid].cash} times`);
  add("sponsored","🍼","The Sponsored",best("treatIn",0.5),pid=>`got treated to ${rm(st[pid].treatIn)}`);
  if(linked.length>1){ const maxActs=Math.max(...linked.map(id=>st[id].acts)); if(maxActs>0){ const afk=[...linked].sort((a,b)=>st[a].acts-st[b].acts||(won[a]||0)-(won[b]||0))[0];
    add("afk","💤","The AFK",afk,pid=>st[pid].acts?`only ${st[pid].acts} change${st[pid].acts>1?"s":""} the whole trip`:"didn't touch the app once"); } }
  const spenders=P.filter(id=>st[id].spend>0); if(spenders.length>1){ const low=[...spenders].sort((a,b)=>st[a].spend-st[b].spend).find(id=>(won[id]||0)<CAP);
    add("saver","🪙","The Budget King",low,pid=>`spent only ${rm(st[pid].spend)}`); }
  // Fewer people, fewer awards: headcount + 1. Everyone gets one before anyone gets a second; the rest by priority.
  const PRI=["spender","planner","afk","heart","bank","foodie","shop","saver","sponsored","accountant","tix","cash"];
  list.sort((a,b)=>PRI.indexOf(a.key)-PRI.indexOf(b.key));
  const max=Math.max(2,P.length+1), pick=[], got={};
  if(list[0]){ pick.push(list[0]); got[list[0].pid]=1; }
  for(const a of list.slice(1)){ if(pick.length>=max) break; if(!got[a.pid]){ pick.push(a); got[a.pid]=1; } }
  for(const a of list.slice(1)){ if(pick.length>=max) break; if(!pick.includes(a)){ pick.push(a); got[a.pid]=(got[a.pid]||0)+1; } }
  pick.sort((a,b)=>PRI.indexOf(a.key)-PRI.indexOf(b.key));
  return pick.map(x=>({key:x.key,emoji:x.emoji,title:x.title,pid:x.pid,line:x.line(x.pid)}));
}

function myBudget(){

  let yenShare=0,rmShare=0,paid=0,paidRM=0;
  for(const e of S.expenses){
    const {f}=shareFor(e,me.id);
    if(f){ yenShare+=yenEq(e)*f; const b=rmOf(e); if(b!=null) rmShare+=b*f; }

}

async function compressFile(f){
  const toURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
  if(f.type==="application/pdf"){ if(f.size>700*1024) throw {code:"pdf_big"}; return {data:await toURL(f),type:f.type}; }
  const bmp=await createImageBitmap(f); const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
  const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height);
  let q=0.85, out=c.toDataURL("image/jpeg",q); while(out.length>900000&&q>0.45){ q-=0.1; out=c.toDataURL("image/jpeg",q); }
  if(out.length>1000000) throw {code:"img_big"}; return {data:out,type:"image/jpeg"};
}

document.addEventListener("click",async ev=>{

  if(t.closest("#sheetRoot")) return;
  const day=t.closest("[data-day]"); if(day){S.dayId=day.dataset.day;ls.set("day",S.dayId);render();return}
  const it=t.closest("[data-item]"); if(it&&W()){itemSheet(S.dayId,+it.dataset.item);return}
  const ex=t.closest("[data-exp]"); if(ex){expenseSheet(ex.dataset.exp,!!t.closest("[data-bankfocus]"));return}
  const tk=t.closest("[data-task]"); if(tk){taskSheet(tk.dataset.task);return}
  const nt=t.closest("[data-note]"); if(nt){noteSheet(nt.dataset.note);return}

  const wl=t.closest("[data-wallet]"); if(wl){walletView(wl.dataset.wallet);return}
  const tv=t.closest("[data-tv]"); if(tv){S.todoView=tv.dataset.tv;ls.set("todoView",S.todoView);render();return}
  const sh=t.closest("[data-shop]"); if(sh){shopSheet(sh.dataset.shop);return}
  const ng=t.closest("[data-ng]"); if(ng){S.notesGroup=ng.dataset.ng;render();return}
  const sf=t.closest("[data-shopf]"); if(sf){ const v=sf.dataset.shopf; let F=[...(S.shopFilter||[])];
    if(!v) F=[]; else F=F.includes(v)?F.filter(x=>x!==v):[...F,v];
    S.shopFilter=F; ls.set("shopFilter",JSON.stringify(F)); render(); return; }
  const pm=t.closest("[data-planmine]"); if(pm){ S.planMine=pm.dataset.planmine==="1"; ls.set("planMine",S.planMine?"1":"0"); render(); return; }
  const fd=t.closest("[data-fcdel]"); if(fd){ const me=myPerson(); if(me){ const F=fcGet(me.id); F.lines=(F.lines||[]).filter((_,i)=>i!==+fd.dataset.fcdel); fcSet(me.id,F); render(); } return; }
  const ph=t.closest("[data-photo]"); if(ph){ const x=S.shopping.find(y=>y.photo===ph.dataset.photo); if(ph.dataset.photo) photoSheet(ph.dataset.photo,ph.dataset.ptitle,x&&x.thumb); return; }
  const svb=t.closest("[data-spendview]"); if(svb){S.spendView=svb.dataset.spendview;ls.set("spendView",S.spendView);render();return}
  const ivr=t.closest("[data-invrole]"); if(ivr){S.invRole=ivr.dataset.invrole;ls.set("invRole",S.invRole);render();return}
  const th=t.closest("[data-theme-set]"); if(th){ls.set("theme",th.dataset.themeSet);applyTheme();render();return}
  const fxb=t.closest("[data-fx]"); if(fxb){ls.set("fx",fxb.dataset.fx);fxStart();render();return}
  const ac=t.closest("[data-accent]"); if(ac){ls.set("accent",ac.dataset.accent);applyTheme();render();return}
  const a=t.closest("[data-act]"); if(!a) return;
  switch(a.dataset.act){
    case "addItem": itemSheet(S.dayId,null); break;
    case "dayVis": dayVisSheet(); break;
    case "editDay": daySheet(); break;
    case "addShop": shopSheet(null); break;
    case "addWallet": if(S.canWrite) walletAdd(); break;
    case "editBudget": budgetSheet(); break;
    case "pickMe": { const pid=a.dataset.pid; if(claimedBy(pid)){toast("Someone else already picked that name");break}
      if(myPerson()&&!S.isOwner){toast("Ask the Owner to change your name");break}
      try{ const b=writeBatch(fs); b.set(doc(fs,"claims/"+pid),{uid:S.myId}); b.update(doc(fs,"members/"+S.myId),{personId:pid}); await b.commit();
        toast("You're "+pname(pid)); closeSheet();
        try{ S.db.collection("audit").add({at:Date.now(),uid:S.myId,who:pname(pid),a:"Picked their name",t:pname(pid)}).catch(()=>{}); }catch(e){}
      }catch(e){ toast("That name was just taken. Pick another, or ask the Owner."); }
      break; }
    case "addMe": { const inp=a.closest(".f").querySelector("#meNew"); const name=(inp.value||"").trim(); if(!name){toast("Type your name");break}
      if(S.people.some(p=>p.name.trim().toLowerCase()===name.toLowerCase())){toast("That name's already on the list — pick it instead");break}
      const ref=doc(collection(fs,"people"));
      const ok=await write(async()=>{ const b=writeBatch(fs); b.set(ref,{name,order:Math.max(0,...S.people.map(x=>x.order||0))+1,by:S.myId}); b.set(doc(fs,"claims/"+ref.id),{uid:S.myId}); b.update(doc(fs,"members/"+S.myId),{personId:ref.id}); await b.commit(); },"Added you as "+name,["Added themselves",name]);
      if(ok) closeSheet(); break; }
    case "editNick": { const m=S.member||{};
      openSheet("Your name",`<div class="f"><label for="nk">Name shown to others</label><input id="nk" maxlength="30" value="${esc(m.nick||m.name||"")}"><span class="hint">Instead of your Google account name${m.name?` (${esc(m.name)})`:""}. Leave empty to use that.</span></div><button class="btn primary" id="nkSave">Save</button>`,p=>{
        $("#nkSave",p).onclick=async()=>{ const v=$("#nk",p).value.trim().slice(0,30); const nick=(v&&v!==m.name)?v:null;
          if(await write(()=>S.db.doc("members/"+S.myId).update({nick}),"Name saved",["Changed their name",mname({...m,nick})])) closeSheet(); };
      }); break; }
    case "skipWho": ls.set("whoSkip:"+S.myId,"1"); render(); break;
    case "changeWho": openSheet("Which one is you?",whoPicker()); break;
    case "signIn": doSignIn(); break;
    case "signOut": signOut(auth).then(()=>location.reload()); break;
    case "setupOwner": setupOwner(); break;
    case "importData": importData(); break;
    case "joinTrip": joinTrip(); break;
    case "newInvite": newInvite(a.dataset.role); break;
    case "exportTrip": exportTrip(); break;
    case "fcAdd": { const me=myPerson(); if(!me) break; const n=($("#fcN")||{}).value||"", y=parseFloat((($("#fcY")||{}).value||"").replace(/[^\d.]/g,""));
      if(!n.trim()||!(y>0)){ toast("Add a name and a ¥ amount"); break; } const F=fcGet(me.id); F.lines=[...(F.lines||[]),{n:n.trim(),y}]; fcSet(me.id,F); render(); break; }
    case "mvpPreview": mvpPreview(); break;
    case "mvpHide": write(()=>deleteDoc(doc(fs,"meta/awards")),"MVPs hidden",["Hid the trip MVPs",""]); break;
    case "importUpdate": importUpdate(); break;
    case "shareInvite": shareInvite(a.dataset.link,a.dataset.role,a); break;
    case "copyInvite": { const v=a.dataset.link; try{await navigator.clipboard.writeText(v);toast("Invite link copied")}catch(e){toast("Copy the link from the box")} break; }
    case "resetInvite": { const r=a.dataset.role; const old=S.invites.filter(x=>x.role===r);
      if(a.dataset.armed!=="1"){ a.dataset.armed="1"; a.textContent="Tap again to reset"; setTimeout(()=>{ if(a.isConnected){a.dataset.armed="";a.textContent="Reset link"} },3000); break; }
      await write(async()=>{ const b=writeBatch(fs); old.forEach(x=>b.delete(doc(fs,"invites/"+x.id))); await b.commit(); },null,["Reset invite link",ROLE_LABEL[r]]);
      newInvite(r); break; }
    case "delInvite": write(()=>S.db.doc("invites/"+a.dataset.code).delete(),"Invite cancelled",["Cancelled invite",a.dataset.code]); break;
    case "memberRole": memberSheet(a.dataset.uid); break;
    case "fetchRate": break;
    case "addExp": if(!S.people.length){toast("Add people in the Trip tab first");break} expenseSheet(null); break;
    case "editRate": rateSheet(); break;
    case "addTask": taskSheet(null); break;
    case "hideDone": S.hideDone=!S.hideDone; render(); break;
    case "addNote": noteSheet(null); break;
    case "addPerson": personSheet(null); break;
    case "copyLink": { const inp=$("#shareLink"); try{await navigator.clipboard.writeText(SHARE_URL);toast("Link copied")}catch(e){inp.select();toast("Select and copy the link")} break; }
  }
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&$("#sheet")) closeSheet();
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches("[data-item]")){ev.preventDefault();itemSheet(S.dayId,+ev.target.dataset.item)}
});
document.addEventListener("change",async ev=>{
  const t=ev.target;
  if(t.matches("[data-shopcheck]")){ const id=t.dataset.shopcheck; const v=t.checked; const it=S.shopping.find(x=>x.id===id)||{}; const ok=await write(()=>S.db.doc("shopping/"+id).update({done:v}),"",[v?"Bought":"Un-ticked",it.text]); if(!ok) t.checked=!v; }
  if(t.matches("[data-check]")){ const id=t.dataset.check; const v=t.checked; const ok=await write(()=>S.db.doc("tasks/"+id).update({done:v}),"",[v?"Ticked":"Unticked",(S.tasks.find(x=>x.id===id)||{}).text]); if(!ok) t.checked=!v; }
  if(t.id==="rateDate"){ S.rateDate=t.value||todayJST(); render(); }
  if(t.matches("[data-fc]")){ const me=myPerson(); if(me){ const F=fcGet(me.id); F[t.dataset.fc]=parseFloat(t.value.replace(/[^\d.]/g,""))||0; fcSet(me.id,F); render(); } }
  if(t.id==="accentPick"){ ls.set("accent",t.value); applyTheme(); render(); }
});
document.addEventListener("input",ev=>{ if(ev.target.id==="cvY"){ S.cv=ev.target.value.replace(/[^\d.]/g,""); const tr=rateFor(todayJST()); const o=$("#cvR"); if(o) o.textContent=(S.cv&&tr)?rm(parseFloat(S.cv)*tr.rate100/100):"RM —"; return; } if(ev.target.id==="accentPick"){ document.documentElement.style.setProperty("--accent",ev.target.value) } });

/* ---------- boot ---------- */
(function boot(){
  const h=(location.hash||"").slice(1);
  S.tab=["plan","spend","todo","notes","trip"].includes(h)?h:ls.get("tab","plan");
  S.dayId=ls.get("day",null); S.todoView=ls.get("todoView","todo"); S.invRole=ls.get("invRole","traveler"); S.spendView=ls.get("spendView","mine"); S.planMine=ls.get("planMine","1")!=="0"; try{ S.shopFilter=JSON.parse(ls.get("shopFilter","[]"))||[]; }catch(e){ S.shopFilter=[]; }
  render(); setRole();
  const inv=new URLSearchParams(location.search).get("invite"); if(inv) S.invite=inv;
  if(!CONFIGURED){ render(); return; }
  S.db=mkDb(); S.assets=null;
  const unsubs=[]; const stopAll=()=>{ while(unsubs.length) try{unsubs.pop()()}catch(e){} };
  const sub=(path,orderField,cb,dir)=>{ let q=S.db.collection(path); if(orderField) q=q.orderBy(orderField,dir);
    unsubs.push(q.onSnapshot(snap=>{cb(snap.docs.map(d=>({id:d.id,...d.data()}))); render(); },()=>{})); };
  let dataStarted=false;
  const startData=()=>{ if(dataStarted) return; dataStarted=true;
    sub("days","order",v=>S.days=v); sub("notes","order",v=>S.notes=v); sub("tasks","order",v=>S.tasks=v);
    sub("people","order",v=>S.people=v); if(S.isOwner) sub("expenses",null,v=>S.expenses=v);
    else { const xp={}; const xm=()=>{ const m=new Map(); Object.values(xp).forEach(a=>a.forEach(x=>m.set(x.id,x))); S.expenses=[...m.values()]; render(); };
      const xq=(k,cons)=>unsubs.push(onSnapshot(query(collection(fs,"expenses"),...cons),sn=>{ xp[k]=sn.docs.map(d=>({id:d.id,...d.data()})); xm(); },e=>console.warn("expenses",k,e)));
      xq("by",[where("by","==",S.myId)]); const pid=(S.member||{}).personId;
      if(pid){ xq("split",[where("split","array-contains",pid)]); xq("paid",[where("paidBy","==",pid)]); } }
    sub("rates",null,v=>{S.rates={}; v.forEach(r=>S.rates[r.id]=r)}); sub("meta",null,v=>{S.meta=v.find(x=>x.id==="trip")||{}; S.awards=v.find(x=>x.id==="awards")||null;});
    if(S.isOwner) sub("wallet","at",v=>{ S.wallet=v; const old=v.filter(w=>!w.vis); if(old.length){ const b=writeBatch(fs); old.forEach(w=>b.update(doc(fs,"wallet/"+w.id),{vis:["all"]})); b.commit().catch(()=>{}); } });
    else { const parts={}; const merge=()=>{ const m=new Map(); Object.values(parts).forEach(a=>a.forEach(w=>m.set(w.id,w))); S.wallet=[...m.values()].sort((a,b)=>(a.at||0)-(b.at||0)); render(); };
      const wq=(key,cons)=>unsubs.push(onSnapshot(query(collection(fs,"wallet"),...cons),sn=>{ parts[key]=sn.docs.map(d=>({id:d.id,...d.data()})); merge(); },e=>console.warn("wallet",key,e)));
      wq("all",[where("vis","array-contains","all")]); wq("by",[where("by","==",S.myId)]);
      if((S.member||{}).personId) wq("me",[where("vis","array-contains",S.member.personId)]); } sub("shopping","at",v=>S.shopping=v); sub("members",null,v=>S.members=v); sub("claims",null,v=>{S.claims=v; if(S.isOwner) backfillClaims();});
    if(S.isOwner) unsubs.push(S.db.collection("audit").orderBy("at","desc").limit(60).onSnapshot(snap=>{ S.audit=snap.docs.map(d=>({id:d.id,...d.data()})); render(); },()=>{}));
    if(S.isOwner) sub("invites","at",v=>S.invites=v,"desc");
    setTimeout(()=>{S.ready=true; render(); setTimeout(()=>{ if(S.canWrite&&!S.rates[todayJST()]) autoRate(); },1500); },400);
  };
  const autoRate=async()=>{ const lr=await fetchLiveRate(); if(!lr) return; S.liveRate={rate100:lr.rate100,source:lr.source,date:lr.date}; render();
    // Planners/Owner save it as today's rate once a day, so spending and budgets use it without anyone tapping a button
    const t=todayJST(); if(S.canWrite&&S.ready&&!S.rates[t]&&ls.get("autoRate","")!==t){ ls.set("autoRate",t);
      try{ await setDoc(doc(fs,"rates/"+t),{rate100:Math.round(lr.rate100*10000)/10000,source:"Auto: mid-market rate (same basis as Wise, before fees) · "+lr.source,auto:true,setAt:Date.now()}); }catch(e){} } };
  autoRate(); document.addEventListener("visibilitychange",()=>{ if(!document.hidden) autoRate(); });
  setInterval(()=>{ if(S.ready&&!S.rates[todayJST()]) autoRate(); },60*60*1000);
  onAuthStateChanged(auth, async u=>{
    stopAll(); dataStarted=false; S.authChecked=true; S.authUser=u||null; S.myId=u?u.uid:null;
    S.ownerUid=undefined; S.member=undefined; render();
    if(!u) return;
    if(S.invite){ getDoc(doc(fs,"invites/"+S.invite)).then(sn=>{ S.inviteRole=sn.exists()?sn.data().role:null; render(); }).catch(()=>{ S.inviteRole=null; render(); }); }
    unsubs.push(onSnapshot(doc(fs,"config/owner"),sn=>{ S.ownerUid=sn.exists()?sn.data().uid:null; render(); },()=>{ S.ownerUid=null; render(); }));
    unsubs.push(onSnapshot(doc(fs,"members/"+u.uid),sn=>{
      const prevRole=(S.member||{}).role, prevPid=(S.member||{}).personId;
      S.member=sn.exists()?{id:sn.id,...sn.data()}:null;
      S.isOwner=!!S.member&&S.member.role==="admin"; S.canWrite=!!S.member&&S.member.role!=="traveler"; S.assets=S.canWrite?{}:null;
      if(S.member&&(!dataStarted||prevRole!==S.member.role||(S.member.role!=="admin"&&(prevPid||null)!==(S.member.personId||null)))){ if(dataStarted){ stopAll(); location.reload(); return; } startData(); }
      setRole(); render();
    },()=>{ S.member=null; render(); }));
  });
})();
</script>
</body>
</html>
