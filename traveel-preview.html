function fxFrame(t){
  const c=$("#fx"); if(!c||FX.kind==="off") return; const g=c.getContext("2d");
  const dt=Math.min(3,FX.last?(t-FX.last)/16.7:1); FX.last=t;
  const dark=document.documentElement.dataset.theme==="dark"||(document.documentElement.dataset.theme!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);
  g.setTransform(FX.dpr,0,0,FX.dpr,0,0); g.clearRect(0,0,FX.w,FX.h);
  g.globalAlpha=dark?.4:.5;
  for(const p of FX.parts){
    p.ph+=.02*dt; p.y+=p.vy*dt; p.x+=(p.vx+Math.sin(p.ph)*p.sw*.35)*dt; p.rot+=p.vr*dt;
    if(p.y>FX.h+30||p.x>FX.w+40||p.x<-40) Object.assign(p,fxNew(true));
    g.save(); g.translate(p.x,p.y);
    if(FX.kind==="snow"){ g.fillStyle=dark?"#ffffff":"#9fb4c8"; g.globalAlpha=dark?.55:.45; g.beginPath(); g.arc(0,0,p.s,0,6.28); g.fill(); }
    else { p.flip+=p.vf*dt; g.rotate(p.rot); if(p.vf) g.scale(.35+.65*Math.abs(Math.cos(p.flip)),1); g.drawImage(p.img,-p.s/2,-p.s/2,p.s,p.s); }
    g.restore();
  }
  FX.raf=requestAnimationFrame(fxFrame);
}
function fxStart(){
  cancelAnimationFrame(FX.raf); FX.last=0; FX.kind=fxKind(); const c=$("#fx"); if(!c) return;
  fxResize(); const g=c.getContext("2d"); g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,c.width,c.height);
  if(FX.kind==="off"){ FX.parts=[]; return; }
  const n=Math.round(Math.min(60,Math.max(FX.kind==="daruma"?10:18,FX.w*FX.h/(FX.kind==="snow"?9000:FX.kind==="daruma"?30000:16000))));
  FX.parts=Array.from({length:n},()=>fxNew(false)); FX.raf=requestAnimationFrame(fxFrame);
}
addEventListener("resize",()=>{ if(FX.kind!=="off") fxResize(); });
document.addEventListener("visibilitychange",()=>{ if(document.hidden) cancelAnimationFrame(FX.raf); else if(FX.kind!=="off"){ FX.last=0; FX.raf=requestAnimationFrame(fxFrame); } });
function applyTheme(){
  const t=ls.get("theme","system"), root=document.documentElement;
  if(t==="system") delete root.dataset.theme; else root.dataset.theme=t;
  const a=ls.get("accent",PRESETS[0]);

async function fetchLiveRate(){
  try{ const r=await fetch("https://api.frankfurter.app/latest?from=JPY&to=MYR"); const j=await r.json(); if(j&&j.rates&&j.rates.MYR) return {rate100:j.rates.MYR*100,source:"ECB via Frankfurter ("+j.date+")",date:j.date}; }catch(e){}
  try{ const r=await fetch("https://open.er-api.com/v6/latest/JPY"); const j=await r.json(); if(j&&j.rates&&j.rates.MYR) return {rate100:j.rates.MYR*100,source:"open.er-api.com",date:todayJST()}; }catch(e){}
  return null;
}
function rateFor(date){
  if(S.rates[date]) return {...S.rates[date],date,exact:true};
  const ds=Object.keys(S.rates).filter(d=>d<=date).sort(); const any=Object.keys(S.rates).sort();
  const k=ds.length?ds[ds.length-1]:any[any.length-1];
  if(k) return {...S.rates[k],date:k,exact:false};
  return S.liveRate?{...S.liveRate,exact:false,live:true}:null;
}
function est(e){ return e.rate100? e.yen*e.rate100/100 : null }
function basis(e){ if(e.method==="card"&&e.bank>0) return e.bank; return est(e) }
function totals(){
  let y=0,estSum=0,missing=0,bank=0,bankEst=0,bankN=0,cardN=0,actual=0;
  for(const e of S.expenses){
    y+=e.yen||0; const v=est(e); if(v==null) missing++; else estSum+=v;
    const b=basis(e); if(b!=null) actual+=b;
    if(e.method==="card"){cardN++; if(e.bank>0&&v!=null){bank+=e.bank;bankEst+=v;bankN++}}
  }
  return {y,estSum,missing,bank,bankEst,bankN,cardN,actual};
}
function balances(){
  const net={}; S.people.forEach(p=>net[p.id]=0);
  for(const e of S.expenses){
    const v=basis(e); if(v==null||!e.paidBy) continue;
    const split=(e.split&&e.split.length?e.split:S.people.map(p=>p.id)).filter(id=>id in net);
    if(!split.length) continue;
    if(e.paidBy in net) net[e.paidBy]+=v;
    split.forEach(id=>net[id]-=v/split.length);
  }
  const cred=[],debt=[];
  for(const [id,v] of Object.entries(net)){ if(v>0.005) cred.push([id,v]); else if(v<-0.005) debt.push([id,-v]); }
  cred.sort((a,b)=>b[1]-a[1]); debt.sort((a,b)=>b[1]-a[1]);
  const moves=[]; let i=0,j=0;
  while(i<debt.length&&j<cred.length){ const m=Math.min(debt[i][1],cred[j][1]); moves.push([debt[i][0],cred[j][0],m]); debt[i][1]-=m; cred[j][1]-=m; if(debt[i][1]<0.005)i++; if(cred[j][1]<0.005)j++; }
  return {net,moves};
}

function myBudget(){
  const me=myPerson(); if(!me) return null;
  let yenShare=0,rmShare=0,paid=0;
  for(const e of S.expenses){
    const split=(e.split&&e.split.length?e.split:S.people.map(p=>p.id));
    if(split.includes(me.id)){ yenShare+=(e.yen||0)/split.length; const b=basis(e); if(b!=null) rmShare+=b/split.length; }
    if(e.paidBy===me.id) paid+=(e.yen||0);
  }
  const budget=Number(ls.get("budget_"+me.id,"186000"))||186000;
  const cur=ls.get("budgetCur_"+me.id,"JPY"), bRM=Number(ls.get("budgetRM_"+me.id,""))||0, bRate=Number(ls.get("budgetRate_"+me.id,""))||0;
  const start=Date.UTC(2026,11,20), end=Date.UTC(2027,0,4), t=Date.parse(todayJST());
  const daysIn=Math.max(0,Math.min(16,Math.floor((t-start)/864e5)+1));
  return {me,yenShare,rmShare,paid,budget,daysIn,cur,bRM,bRate};
}

function viewTodo(){

  if(!S.tasks.length) return S.ready?`<div class="empty">No to-dos yet.</div>${W()?`<button class="btn plain" data-act="addTask">+ Add to-do</button>`:""}`:`<div class="empty">Loading…</div>`;
  const groups=[]; S.tasks.forEach(t=>{ if(!groups.includes(t.group)) groups.push(t.group) });
  const done=S.tasks.filter(t=>t.done).length;
  return `${todoSwitch()}
  <div class="row"><div><div class="eyebrow">Done</div><div class="big num">${done}<span class="muted" style="font-size:18px"> / ${S.tasks.length}</span></div></div><div class="spacer"></div>
    <button class="btn small plain" data-act="hideDone" aria-pressed="${S.hideDone}">${S.hideDone?"Show done":"Hide done"}</button>${W()?`<button class="btn small" data-act="addTask">+ Add</button>`:""}</div>
  ${groups.map(g=>{const ts=S.tasks.filter(t=>t.group===g&&(!S.hideDone||!t.done)); const all=S.tasks.filter(t=>t.group===g); if(!ts.length) return "";
    return `<div class="section"><div class="grouphead"><h3>${esc(g)}</h3><span class="small muted num">${all.filter(t=>t.done).length}/${all.length}</span></div>
    <div>${ts.map(t=>`<div class="task${t.done?" done":""}"><input type="checkbox" id="tk-${esc(t.id)}" data-check="${esc(t.id)}" ${t.done?"checked":""} ${W()?"":"disabled"} aria-label="${esc(t.text)}">
      <button class="main" ${W()?`data-task="${esc(t.id)}"`:"disabled"}><div class="ti">${esc(t.text)}</div>${t.detail?`<div class="sub">${rich(t.detail)}</div>`:""}</button>${t.due?`<span class="due">${esc(t.due)}</span>`:""}</div>`).join("")}</div></div>`}).join("")}`;
}

function viewNotes(){
  const groups=[...new Set(S.notes.map(n=>n.group||"Heads-up"))];
  if(!groups.includes(S.notesGroup)&&groups.length) S.notesGroup=groups[0];
  const secs=S.notes.filter(n=>(n.group||"Heads-up")===S.notesGroup);
  if(!S.notes.length) return S.ready?`<div class="empty">No notes yet.</div>`:`<div class="empty">Loading…</div>`;
  return `
  ${groups.length>1?`<div class="seg" role="group">${groups.map(g=>`<button data-ng="${esc(g)}" aria-pressed="${g===S.notesGroup}">${esc(g)}</button>`).join("")}</div>`:""}
  <div class="section">${secs.map((s,i)=>`<details class="note" ${i===0?"open":""}><summary>${esc(s.title)}<span class="muted small" style="font-weight:500">${(s.lines||[]).length}</span></summary>
    <ul>${(s.lines||[]).map(l=>`<li>${rich(l)}</li>`).join("")}</ul>
    ${W()?`<div class="ed"><button class="btn small plain" data-note="${esc(s.id)}">Edit</button></div>`:""}</details>`).join("")}</div>
  ${W()?`<button class="btn plain" data-act="addNote">+ Add section</button>`:""}`;
}

function inviteMessage(link,role){ const trip=(S.meta||{}).name||"our trip";
  return role==="planner"?`🗺️ Help me plan ${trip}! Hop in as a Planner on Traveel 👉 ${link}`:`🌸 Pack your bags! You're coming on ${trip}. Tap to join us on Traveel 👉 ${link}`; }
function qrCanvas(text,size){ return new Promise(res=>{ if(!window.QRCode) return res(null); const d=document.createElement("div"); d.style.cssText="position:fixed;left:-9999px;top:0";
  document.body.appendChild(d); new QRCode(d,{text,width:size,height:size,colorDark:"#1d1d1f",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
  setTimeout(()=>{ const c=d.querySelector("canvas"); res(c); d.remove(); },60); }); }
function rrect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
window.__inviteImage=(...a)=>inviteImage(...a);
async function inviteImage(link,role){
  const W=1080,H=1350, c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d");
  const acc=getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#e0475b"; const font='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
  const bg=g.createLinearGradient(0,0,W,H); bg.addColorStop(0,"#fff7f9"); bg.addColorStop(1,"#fbd9e3"); g.fillStyle=bg; g.fillRect(0,0,W,H);
  // falling petals
  const SPR=fxSprites(); let seed=7; const rnd=()=>((seed=(seed*9301+49297)%233280)/233280);
  for(let i=0;i<26;i++){ const img=i%7===0?SPR.flower:SPR.petals[i%3], sz=i%7===0?70+rnd()*40:34+rnd()*30, x=rnd()*W, y=rnd()*H;
    if(x>150&&x<930&&y>500&&y<1180) continue; g.save(); g.globalAlpha=.55; g.translate(x,y); g.rotate(rnd()*6.28); g.drawImage(img,-sz/2,-sz/2,sz,sz); g.restore(); }
  g.textAlign="center"; g.textBaseline="alphabetic";
  g.fillStyle=acc; g.font=`700 30px ${font}`; g.fillText("T R A V E E L",W/2,118);
  g.fillStyle="#1d1d1f"; g.font=`800 92px ${font}`; g.fillText("You're invited!",W/2,236);
  const m=S.meta||{}; g.font=`700 52px ${font}`; g.fillStyle="#1d1d1f"; g.fillText(m.name||"Our trip",W/2,318);
  if(m.subtitle){ g.font=`500 32px ${font}`; g.fillStyle="#6b6b73"; g.fillText(m.subtitle,W/2,370); }
  // role pill
  const label=role==="planner"?"Joining as a Planner":"Joining as a Traveler"; g.font=`700 30px ${font}`; const pw=g.measureText(label).width+64;
  rrect(g,(W-pw)/2,410,pw,62,31); g.fillStyle=acc; g.fill(); g.fillStyle="#fff"; g.fillText(label,W/2,452);
  // QR card
  rrect(g,190,510,700,700,48); g.fillStyle="#fff"; g.shadowColor="rgba(160,60,90,.18)"; g.shadowBlur=40; g.shadowOffsetY=12; g.fill(); g.shadowColor="transparent";
  const q=await qrCanvas(link,560); if(q){ g.imageSmoothingEnabled=false; g.drawImage(q,260,560,560,560); g.imageSmoothingEnabled=true; }
  g.fillStyle="#6b6b73"; g.font=`500 28px ${font}`; g.fillText("Scan me, or tap the link in the message",W/2,1170);
  g.fillStyle="#1d1d1f"; g.font=`600 26px ${font}`; let l=link.replace(/^https?:\/\//,""); while(g.measureText(l).width>940&&l.length>20) l=l.slice(0,-2); if(l!==link.replace(/^https?:\/\//,"")) l+="…";
  g.fillText(l,W/2,1270);
  return await new Promise(r=>c.toBlob(r,"image/png"));
}
async function shareInvite(link,role,btn){
  const text=inviteMessage(link,role); const old=btn?btn.textContent:""; if(btn){btn.disabled=true;btn.textContent="Making the card…";}
  try{
    const blob=await inviteImage(link,role); const file=blob?new File([blob],"traveel-invite.png",{type:"image/png"}):null;
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],text,title:"Join the trip"}); }
    else if(navigator.share){ await navigator.share({text,title:"Join the trip"}); }
    else { try{await navigator.clipboard.writeText(text)}catch(e){} if(blob){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="traveel-invite.png"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
      toast("Card downloaded and message copied. Paste it anywhere"); }
  }catch(e){ if(e&&e.name!=="AbortError") toast("Couldn't share. Use Copy instead"); }
  if(btn){btn.disabled=false;btn.textContent=old;}
}
function drawQR(){
  if(!window.QRCode) return;
  document.querySelectorAll("[data-qr]").forEach(el=>{ if(el.dataset.done) return; el.dataset.done="1"; new QRCode(el,{text:el.dataset.qr,width:156,height:156,colorDark:"#111111",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M}); });
}

let sheetClose=null;
function openSheet(title,body,onMount){
  const root=$("#sheetRoot");
  root.innerHTML=`<div class="sheet" id="sheet"><div class="panel" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="ph"><h2>${esc(title)}</h2><button class="x" data-close aria-label="Close">×</button></div>${body}</div></div>`;
  const sh=$("#sheet");
  sh.addEventListener("click",e=>{ if(e.target===sh||e.target.closest("[data-close]")) closeSheet() });
  sheetClose=null; onMount&&onMount(sh.querySelector(".panel"));
  const f=sh.querySelector("input:not([type=hidden]),textarea,select"); if(f&&!f.readOnly) setTimeout(()=>f.focus({preventScroll:true}),50);
}
function closeSheet(){ $("#sheetRoot").innerHTML="" }
// Keep sheets above the on-screen keyboard (iOS doesn't resize the page; Android does with interactive-widget).
(function(){ const vv=window.visualViewport; if(!vv) return; const de=document.documentElement;
  const upd=()=>{ const kb=Math.max(0,Math.round(innerHeight-vv.height-vv.offsetTop)); de.style.setProperty("--kb",(kb>60?kb:0)+"px"); de.style.setProperty("--vvh",Math.round(vv.height)+"px"); };
  vv.addEventListener("resize",upd); vv.addEventListener("scroll",upd); upd();
  document.addEventListener("focusin",e=>{ const el=e.target; if(el&&el.closest&&el.closest(".panel")&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) setTimeout(()=>{ upd(); el.scrollIntoView({block:"center",behavior:"smooth"}); },300); });
})();
function twoStep(btn,label,fn){ btn.addEventListener("click",()=>{ if(btn.dataset.armed){fn()} else {btn.dataset.armed="1";btn.textContent=label;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=btn.dataset.orig}},3000)} }); btn.dataset.orig=btn.textContent }

function itemSheet(dayId,index,preset){

      <div class="f"><label for="iDay">Day</label><select id="iDay">${S.days.map(x=>`<option value="${esc(x.id)}" ${x.id===dayId?"selected":""}>${esc(fmtDate(x.date))} · ${esc(x.city)}</option>`).join("")}</select></div></div>

    <div class="f"><label for="iNote">Details</label><textarea id="iNote" placeholder="Tips, prices, what to see">${esc(it.note)}</textarea><span class="hint">Wrap words in **double stars** to bold them.</span></div>
    <div class="f"><label for="iMap">Google Maps search</label><input id="iMap" value="${esc(it.map)}" placeholder="Place name + area"><span class="hint">Leave empty for no map link.</span></div>

    ${isNew?"":`<div class="row"><button class="btn small plain" id="iUp" ${index===0?"disabled":""}>Move up</button><button class="btn small plain" id="iDown" ${index===d.items.length-1?"disabled":""}>Move down</button><div class="spacer"></div><button class="btn small danger" id="iDel">Delete</button></div>`}
    <button class="btn primary" id="iSave">${isNew?"Add to day":"Save"}</button>`,p=>{

    $("#iSave",p).onclick=async()=>{
      const v=read(); if(!v.title){toast("Add a name for the stop");return}
      const target=$("#iDay",p).value;
      const src=S.days.find(x=>x.id===dayId); const items=[...(src.items||[])];
      if(!isNew) items.splice(index,1);

      } else {

        const ok=await write(async()=>{ await S.db.doc("days/"+target).update({items:[...(tgt.items||[]),v]}); if(!isNew) await S.db.doc("days/"+dayId).update({items}); },"Moved to "+fmtDate(tgt.date),["Moved stop",v.title+" → "+fmtDate(tgt.date)]);

      }

async function fileURL(id){
  if(S.fileCache[id]) return S.fileCache[id];
  const sn=await S.db.doc("files/"+id).get(); if(!sn.exists) return null;
  const f=sn.data(); const blob=await (await fetch(f.data)).blob(); const url=URL.createObjectURL(blob);
  S.fileCache[id]={url,type:f.type}; return S.fileCache[id];
}

function visPicker(vis){ const all=!vis||!vis.length||vis.includes("all");
  return `<div class="f"><span class="lab">Who can see it</span><div class="pick" data-vispick>
    <button type="button" data-vis="all" aria-pressed="${all}">Everyone</button>${S.people.map(p=>`<button type="button" data-vis="${esc(p.id)}" aria-pressed="${!all&&vis.includes(p.id)}">${esc(p.name)}</button>`).join("")}</div>
    <span class="hint">Pick people to keep it private, e.g. someone's own train QR. The Owner can always see everything.</span></div>`; }
function visWire(p){ const box=$("[data-vispick]",p); if(!box) return;
  box.addEventListener("click",ev=>{ const b=ev.target.closest("[data-vis]"); if(!b) return; const all=$('[data-vis="all"]',box);
    if(b===all){ box.querySelectorAll("[data-vis]").forEach(x=>x.setAttribute("aria-pressed",String(x===all))); return; }
    b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true")); const any=[...box.querySelectorAll('[data-vis]:not([data-vis="all"])')].some(x=>x.getAttribute("aria-pressed")==="true");
    all.setAttribute("aria-pressed",String(!any)); }); }
function visRead(p){ const sel=[...$("[data-vispick]",p).querySelectorAll('[data-vis][aria-pressed="true"]')].map(x=>x.dataset.vis); return (!sel.length||sel.includes("all"))?["all"]:sel; }
async function compressFile(f){
  const toURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
  if(f.type==="application/pdf"){ if(f.size>700*1024) throw {code:"pdf_big"}; return {data:await toURL(f),type:f.type}; }
  const bmp=await createImageBitmap(f); const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
  const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height);
  let q=0.85, out=c.toDataURL("image/jpeg",q); while(out.length>900000&&q>0.45){ q-=0.1; out=c.toDataURL("image/jpeg",q); }
  if(out.length>1000000) throw {code:"img_big"}; return {data:out,type:"image/jpeg"};
}

    <button class="btn primary" id="rSave">Save rate</button>`,p=>{
    $("#rSrc",p).addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;$("#rSrc",p).querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true"); const o=$("#rOther",p); o.hidden=b.dataset.v!=="Other"; if(!o.hidden) o.focus()});
    $("#rFetch",p).onclick=async()=>{ const b=$("#rFetch",p); b.disabled=true; b.textContent="Fetching…";
      const lr=await fetchLiveRate(); b.disabled=false; b.textContent="Get today's rate automatically";
      if(!lr){ toast("Couldn't fetch the rate. Type it in."); return; }
      $("#rVal",p).value=lr.rate100.toFixed(3);
      $("#rSrc",p).querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v==="Other")));
      const o=$("#rOther",p); o.hidden=false; o.value=lr.source; };
    $("#rSave",p).onclick=async()=>{
      const r=parseFloat($("#rVal",p).value.replace(/[^\d.]/g,"")); if(!(r>0)){toast("Enter the RM amount for ¥100");return}
      let src=($("#rSrc",p).querySelector('[aria-pressed="true"]')||{}).dataset?.v||"Google";
      if(src==="Other"){ src=$("#rOther",p).value.trim(); if(!src){toast("Type which source you used");return} }
      const apply=$("#rApply",p).checked;
      const ok=await write(async()=>{
        await S.db.doc("rates/"+date).set({rate100:r,source:src,setAt:Date.now()});
        if(apply) for(const e of S.expenses.filter(x=>x.date===date&&x.rate100!==r)) await S.db.doc("expenses/"+e.id).update({rate100:r});
      },"Rate saved",["Saved rate",fmtDate(date)+": RM "+r+" per ¥100 ("+src+")"]);
      if(ok) closeSheet();
    };
  });
}

function taskSheet(id){
  const t=id?{...S.tasks.find(x=>x.id===id)}:{group:(S.tasks[0]||{}).group||"To do",text:"",detail:"",due:""};
  const groups=[...new Set(S.tasks.map(x=>x.group))];
  openSheet(id?"Edit to-do":"Add to-do",`
    <div class="f"><label for="tText">To-do</label><input id="tText" value="${esc(t.text)}"></div>
    <div class="f"><label for="tDetail">Details</label><textarea id="tDetail">${esc(t.detail)}</textarea></div>
    <div class="grid2"><div class="f"><label for="tDue">When</label><input id="tDue" value="${esc(t.due)}" placeholder="e.g. Nov 22"></div>
      <div class="f"><label for="tGroup">Group</label><input id="tGroup" list="tGroups" value="${esc(t.group)}"><datalist id="tGroups">${groups.map(g=>`<option value="${esc(g)}">`).join("")}</datalist></div></div>
    ${id?`<div class="row"><div class="spacer"></div><button class="btn small danger" id="tDel">Delete</button></div>`:""}
    <button class="btn primary" id="tSave">${id?"Save":"Add"}</button>`,p=>{
    $("#tSave",p).onclick=async()=>{
      const text=$("#tText",p).value.trim(); if(!text){toast("Write the to-do first");return}
      const doc={text,detail:$("#tDetail",p).value.trim(),due:$("#tDue",p).value.trim(),group:$("#tGroup",p).value.trim()||"To do"};
      const ok=await write(()=> id?S.db.doc("tasks/"+id).update(doc):S.db.collection("tasks").add({...doc,done:false,order:Math.max(0,...S.tasks.map(x=>x.order||0))+1}), id?"Saved":"Added",[id?"Edited to-do":"Added to-do",text]);
      if(ok) closeSheet();
    };
    if(id) twoStep($("#tDel",p),"Tap again to delete",async()=>{ if(await write(()=>S.db.doc("tasks/"+id).delete(),"Deleted",["Deleted to-do",t.text])) closeSheet(); });
  });
}

function noteSheet(id){
  const n=id?{...S.notes.find(x=>x.id===id)}:{title:"",lines:[],group:S.notesGroup};
  openSheet(id?"Edit notes":"Add section",`
    <div class="f"><label for="nTitle">Section</label><input id="nTitle" value="${esc(n.title)}"></div>
    <div class="f"><label for="nLines">Points (one per line)</label><textarea id="nLines" style="min-height:220px">${esc((n.lines||[]).join("\n"))}</textarea><span class="hint">Wrap words in **double stars** to bold them.</span></div>
    ${id?`<div class="row"><div class="spacer"></div><button class="btn small danger" id="nDel">Delete section</button></div>`:""}
    <button class="btn primary" id="nSave">Save</button>`,p=>{
    $("#nSave",p).onclick=async()=>{
      const title=$("#nTitle",p).value.trim()||"Notes"; const lines=$("#nLines",p).value.split("\n").map(s=>s.trim()).filter(Boolean);
      const ok=await write(()=> id?S.db.doc("notes/"+id).update({title,lines}):S.db.collection("notes").add({title,lines,group:S.notesGroup,order:Math.max(0,...S.notes.map(x=>x.order||0))+1}),"Saved",[id?"Edited notes":"Added notes",title]);
      if(ok) closeSheet();
    };
    if(id) twoStep($("#nDel",p),"Tap again to delete",async()=>{ if(await write(()=>S.db.doc("notes/"+id).delete(),"Deleted",["Deleted notes",n.title])) closeSheet(); });
  });
}

function personSheet(id){
  const pp=id?S.people.find(x=>x.id===id):{name:""};
  const used=id&&S.expenses.some(e=>e.paidBy===id||(e.split||[]).includes(id));
  openSheet(id?"Rename":"Add person",`
    <div class="f"><label for="pName">Name</label><input id="pName" value="${esc(pp.name)}"></div>
    ${id&&S.isOwner?`<div class="row"><div class="spacer"></div><button class="btn small danger" id="pDel" ${used?"disabled":""}>Remove</button></div>${used?`<div class="hint">Can't remove someone who's in a spending entry.</div>`:""}`:""}
    <button class="btn primary" id="pSave">Save</button>`,p=>{
    $("#pSave",p).onclick=async()=>{ const name=$("#pName",p).value.trim(); if(!name){toast("Enter a name");return}
      const ok=await write(()=> id?S.db.doc("people/"+id).update({name}):S.db.collection("people").add({name,order:Math.max(0,...S.people.map(x=>x.order||0))+1}),"Saved",[id?"Renamed person":"Added person",(pp.name&&id?pp.name+" → ":"")+name]); if(ok) closeSheet(); };
    if(id&&!used&&S.isOwner) twoStep($("#pDel",p),"Tap again to remove",async()=>{ if(await write(()=>S.db.doc("people/"+id).delete(),"Removed",["Removed person",pp.name])) closeSheet(); });
  });
}

/* ---------- events ---------- */
document.addEventListener("click",async ev=>{
  const t=ev.target;
  if(t.closest("[data-stop]")) return;
  if(t.closest("#roleChip")){ if(S.member){S.tab="trip";ls.set("tab","trip");render();window.scrollTo(0,0);} return; }
  const tab=t.closest("nav.tabs button"); if(tab){S.tab=tab.dataset.tab;ls.set("tab",S.tab);render();window.scrollTo(0,0);return}
  if(t.closest("#sheetRoot")) return;
  const day=t.closest("[data-day]"); if(day){S.dayId=day.dataset.day;ls.set("day",S.dayId);render();return}
  const it=t.closest("[data-item]"); if(it&&W()){itemSheet(S.dayId,+it.dataset.item);return}
  const ex=t.closest("[data-exp]"); if(ex){expenseSheet(ex.dataset.exp,!!t.closest("[data-bankfocus]"));return}
  const tk=t.closest("[data-task]"); if(tk){taskSheet(tk.dataset.task);return}
  const nt=t.closest("[data-note]"); if(nt){noteSheet(nt.dataset.note);return}
  const ps=t.closest("[data-person]"); if(ps){personSheet(ps.dataset.person);return}
  const ad=t.closest("[data-addr]"); if(ad){addrSheet(ad.dataset.addr);return}
  const wl=t.closest("[data-wallet]"); if(wl){walletView(wl.dataset.wallet);return}
  const tv=t.closest("[data-tv]"); if(tv){S.todoView=tv.dataset.tv;ls.set("todoView",S.todoView);render();return}
  const sh=t.closest("[data-shop]"); if(sh){shopSheet(sh.dataset.shop);return}
  const ng=t.closest("[data-ng]"); if(ng){S.notesGroup=ng.dataset.ng;render();return}
  const sf=t.closest("[data-shopf]"); if(sf){ const v=sf.dataset.shopf; let F=[...(S.shopFilter||[])];
    if(!v) F=[]; else F=F.includes(v)?F.filter(x=>x!==v):[...F,v];
    S.shopFilter=F; ls.set("shopFilter",JSON.stringify(F)); render(); return; }
  const ivr=t.closest("[data-invrole]"); if(ivr){S.invRole=ivr.dataset.invrole;ls.set("invRole",S.invRole);render();return}
  const th=t.closest("[data-theme-set]"); if(th){ls.set("theme",th.dataset.themeSet);applyTheme();render();return}
  const fxb=t.closest("[data-fx]"); if(fxb){ls.set("fx",fxb.dataset.fx);fxStart();render();return}
  const ac=t.closest("[data-accent]"); if(ac){ls.set("accent",ac.dataset.accent);applyTheme();render();return}
  const a=t.closest("[data-act]"); if(!a) return;
  switch(a.dataset.act){
    case "addItem": itemSheet(S.dayId,null); break;
    case "dayVis": dayVisSheet(); break;
    case "editDay": daySheet(); break;
    case "addShop": shopSheet(null); break;
    case "addWallet": if(S.canWrite) walletAdd(); break;
    case "editBudget": budgetSheet(); break;
    case "pickMe": { const pid=a.dataset.pid; if(claimedBy(pid)){toast("Someone else already picked that name");break}
      if(myPerson()&&!S.isOwner){toast("Ask the Owner to change your name");break}
      try{ const b=writeBatch(fs); b.set(doc(fs,"claims/"+pid),{uid:S.myId}); b.update(doc(fs,"members/"+S.myId),{personId:pid}); await b.commit();
        toast("You're "+pname(pid)); closeSheet();
        try{ S.db.collection("audit").add({at:Date.now(),uid:S.myId,who:pname(pid),a:"Picked their name",t:pname(pid)}).catch(()=>{}); }catch(e){}
      }catch(e){ toast("That name was just taken. Pick another, or ask the Owner."); }
      break; }
    case "addMe": { const inp=a.closest(".f").querySelector("#meNew"); const name=(inp.value||"").trim(); if(!name){toast("Type your name");break}
      if(S.people.some(p=>p.name.trim().toLowerCase()===name.toLowerCase())){toast("That name's already on the list — pick it instead");break}
      const ref=doc(collection(fs,"people"));
      const ok=await write(async()=>{ const b=writeBatch(fs); b.set(ref,{name,order:Math.max(0,...S.people.map(x=>x.order||0))+1,by:S.myId}); b.set(doc(fs,"claims/"+ref.id),{uid:S.myId}); b.update(doc(fs,"members/"+S.myId),{personId:ref.id}); await b.commit(); },"Added you as "+name,["Added themselves",name]);
      if(ok) closeSheet(); break; }
    case "editNick": { const m=S.member||{};
      openSheet("Your name",`<div class="f"><label for="nk">Name shown to others</label><input id="nk" maxlength="30" value="${esc(m.nick||m.name||"")}"><span class="hint">Instead of your Google account name${m.name?` (${esc(m.name)})`:""}. Leave empty to use that.</span></div><button class="btn primary" id="nkSave">Save</button>`,p=>{
        $("#nkSave",p).onclick=async()=>{ const v=$("#nk",p).value.trim().slice(0,30); const nick=(v&&v!==m.name)?v:null;
          if(await write(()=>S.db.doc("members/"+S.myId).update({nick}),"Name saved",["Changed their name",mname({...m,nick})])) closeSheet(); };
      }); break; }
    case "skipWho": ls.set("whoSkip:"+S.myId,"1"); render(); break;
    case "changeWho": openSheet("Which one is you?",whoPicker()); break;
    case "signIn": doSignIn(); break;
    case "signOut": signOut(auth).then(()=>location.reload()); break;
    case "setupOwner": setupOwner(); break;
    case "importData": importData(); break;
    case "joinTrip": joinTrip(); break;
    case "newInvite": newInvite(a.dataset.role); break;
    case "shareInvite": shareInvite(a.dataset.link,a.dataset.role,a); break;
    case "copyInvite": { const v=a.dataset.link; try{await navigator.clipboard.writeText(v);toast("Invite link copied")}catch(e){toast("Copy the link from the box")} break; }
    case "resetInvite": { const r=a.dataset.role; const old=S.invites.filter(x=>x.role===r);
      if(a.dataset.armed!=="1"){ a.dataset.armed="1"; a.textContent="Tap again to reset"; setTimeout(()=>{ if(a.isConnected){a.dataset.armed="";a.textContent="Reset link"} },3000); break; }
      await write(async()=>{ const b=writeBatch(fs); old.forEach(x=>b.delete(doc(fs,"invites/"+x.id))); await b.commit(); },null,["Reset invite link",ROLE_LABEL[r]]);
      newInvite(r); break; }
    case "delInvite": write(()=>S.db.doc("invites/"+a.dataset.code).delete(),"Invite cancelled",["Cancelled invite",a.dataset.code]); break;
    case "memberRole": memberSheet(a.dataset.uid); break;
    case "fetchRate": break;
    case "addExp": if(!S.people.length){toast("Add people in the Trip tab first");break} expenseSheet(null); break;
    case "editRate": rateSheet(); break;
    case "addTask": taskSheet(null); break;
    case "hideDone": S.hideDone=!S.hideDone; render(); break;
    case "addNote": noteSheet(null); break;
    case "addPerson": personSheet(null); break;
    case "copyLink": { const inp=$("#shareLink"); try{await navigator.clipboard.writeText(SHARE_URL);toast("Link copied")}catch(e){inp.select();toast("Select and copy the link")} break; }
  }
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&$("#sheet")) closeSheet();
  if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches("[data-item]")){ev.preventDefault();itemSheet(S.dayId,+ev.target.dataset.item)}
});
document.addEventListener("change",async ev=>{
  const t=ev.target;
  if(t.matches("[data-shopcheck]")){ const id=t.dataset.shopcheck; const v=t.checked; const it=S.shopping.find(x=>x.id===id)||{}; const ok=await write(()=>S.db.doc("shopping/"+id).update({done:v}),"",[v?"Bought":"Un-ticked",it.text]); if(!ok) t.checked=!v; }
  if(t.matches("[data-check]")){ const id=t.dataset.check; const v=t.checked; const ok=await write(()=>S.db.doc("tasks/"+id).update({done:v}),"",[v?"Ticked":"Unticked",(S.tasks.find(x=>x.id===id)||{}).text]); if(!ok) t.checked=!v; }
  if(t.id==="rateDate"){ S.rateDate=t.value||todayJST(); render(); }
  if(t.id==="accentPick"){ ls.set("accent",t.value); applyTheme(); render(); }
});
document.addEventListener("input",ev=>{ if(ev.target.id==="cvY"){ S.cv=ev.target.value.replace(/[^\d.]/g,""); const tr=rateFor(todayJST()); const o=$("#cvR"); if(o) o.textContent=(S.cv&&tr)?rm(parseFloat(S.cv)*tr.rate100/100):"RM —"; return; } if(ev.target.id==="accentPick"){ document.documentElement.style.setProperty("--accent",ev.target.value) } });

/* ---------- boot ---------- */
(function boot(){
  const h=(location.hash||"").slice(1);
  S.tab=["plan","spend","todo","notes","trip"].includes(h)?h:ls.get("tab","plan");
  S.dayId=ls.get("day",null); S.todoView=ls.get("todoView","todo"); S.invRole=ls.get("invRole","traveler"); try{ S.shopFilter=JSON.parse(ls.get("shopFilter","[]"))||[]; }catch(e){ S.shopFilter=[]; }
  render(); setRole();
  const inv=new URLSearchParams(location.search).get("invite"); if(inv) S.invite=inv;
  if(!CONFIGURED){ render(); return; }
  S.db=mkDb(); S.assets=null;
  const unsubs=[]; const stopAll=()=>{ while(unsubs.length) try{unsubs.pop()()}catch(e){} };
  const sub=(path,orderField,cb,dir)=>{ let q=S.db.collection(path); if(orderField) q=q.orderBy(orderField,dir);
    unsubs.push(q.onSnapshot(snap=>{cb(snap.docs.map(d=>({id:d.id,...d.data()}))); render(); },()=>{})); };
  let dataStarted=false;
  const startData=()=>{ if(dataStarted) return; dataStarted=true;
    sub("days","order",v=>S.days=v); sub("notes","order",v=>S.notes=v); sub("tasks","order",v=>S.tasks=v);
    sub("people","order",v=>S.people=v); sub("expenses",null,v=>S.expenses=v);
    sub("rates",null,v=>{S.rates={}; v.forEach(r=>S.rates[r.id]=r)}); sub("meta",null,v=>{S.meta=v.find(x=>x.id==="trip")||{}});
    if(S.isOwner) sub("wallet","at",v=>{ S.wallet=v; const old=v.filter(w=>!w.vis); if(old.length){ const b=writeBatch(fs); old.forEach(w=>b.update(doc(fs,"wallet/"+w.id),{vis:["all"]})); b.commit().catch(()=>{}); } });
    else { const parts={}; const merge=()=>{ const m=new Map(); Object.values(parts).forEach(a=>a.forEach(w=>m.set(w.id,w))); S.wallet=[...m.values()].sort((a,b)=>(a.at||0)-(b.at||0)); render(); };
      const wq=(key,cons)=>unsubs.push(onSnapshot(query(collection(fs,"wallet"),...cons),sn=>{ parts[key]=sn.docs.map(d=>({id:d.id,...d.data()})); merge(); },e=>console.warn("wallet",key,e)));
      wq("all",[where("vis","array-contains","all")]); wq("by",[where("by","==",S.myId)]);
      if((S.member||{}).personId) wq("me",[where("vis","array-contains",S.member.personId)]); } sub("shopping","at",v=>S.shopping=v); sub("members",null,v=>S.members=v); sub("claims",null,v=>{S.claims=v; if(S.isOwner) backfillClaims();});
    if(S.isOwner) unsubs.push(S.db.collection("audit").orderBy("at","desc").limit(60).onSnapshot(snap=>{ S.audit=snap.docs.map(d=>({id:d.id,...d.data()})); render(); },()=>{}));
    if(S.isOwner) sub("invites","at",v=>S.invites=v,"desc");
    setTimeout(()=>{S.ready=true; render();},400);
  };
  fetchLiveRate().then(lr=>{ if(lr){ S.liveRate={rate100:lr.rate100,source:lr.source,date:lr.date}; render(); } });
  onAuthStateChanged(auth, async u=>{
    stopAll(); dataStarted=false; S.authChecked=true; S.authUser=u||null; S.myId=u?u.uid:null;
    S.ownerUid=undefined; S.member=undefined; render();
    if(!u) return;
    if(S.invite){ getDoc(doc(fs,"invites/"+S.invite)).then(sn=>{ S.inviteRole=sn.exists()?sn.data().role:null; render(); }).catch(()=>{ S.inviteRole=null; render(); }); }
    unsubs.push(onSnapshot(doc(fs,"config/owner"),sn=>{ S.ownerUid=sn.exists()?sn.data().uid:null; render(); },()=>{ S.ownerUid=null; render(); }));
    unsubs.push(onSnapshot(doc(fs,"members/"+u.uid),sn=>{
      const prevRole=(S.member||{}).role, prevPid=(S.member||{}).personId;
      S.member=sn.exists()?{id:sn.id,...sn.data()}:null;
      S.isOwner=!!S.member&&S.member.role==="admin"; S.canWrite=!!S.member&&S.member.role!=="traveler"; S.assets=S.canWrite?{}:null;
      if(S.member&&(!dataStarted||prevRole!==S.member.role||(S.member.role!=="admin"&&(prevPid||null)!==(S.member.personId||null)))){ if(dataStarted){ stopAll(); location.reload(); return; } startData(); }
      setRole(); render();
    },()=>{ S.member=null; render(); }));
  });
})();
</script>
