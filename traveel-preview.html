<style>
/* Layout: one-column phone app. Sticky header, scrolling screen, fixed bottom tab bar. Accent (user-picked) only on lines, borders, active states. */
:root{
  --bg:#ffffff; --surface:#ffffff; --fill:#f4f4f5; --line:#e6e6e9; --fg:#18181b; --muted:#6c6c75; --faint:#9a9aa3;
  --good:#1a7f4b; --bad:#c0392b;
  --accent:#e0475b; --on-accent:#ffffff;
  --accent-soft:color-mix(in srgb, var(--accent) 12%, transparent);
  --accent-line:color-mix(in srgb, var(--accent) 55%, var(--line));
  --font:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#202124; --surface:#28292c; --fill:#2e2f33; --line:#3a3b40; --fg:#ececee; --muted:#a3a3ab; --faint:#7d7d86;
  --good:#4cc38a; --bad:#ff7a6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#202124; --surface:#28292c; --fill:#2e2f33; --line:#3a3b40; --fg:#ececee; --muted:#a3a3ab; --faint:#7d7d86;
  --good:#4cc38a; --bad:#ff7a6b; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--accent-line);color:var(--fg);background:transparent;white-space:nowrap}
.chip.soft{border-color:var(--line);color:var(--muted)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:16px;display:flex;flex-direction:column;gap:18px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-block:6px}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--faint);cursor:pointer;border-radius:10px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{margin:0;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent-line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.plain{border-color:var(--line)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
.linkchip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.linkchip:hover{border-color:var(--accent-line);color:var(--fg)}
.banner{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:14px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px}
.section{display:flex;flex-direction:column;gap:10px}
/* day strip */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin-inline:-2px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:54px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 8px;text-align:center;cursor:pointer}
.day b{display:block;font-size:17px;line-height:1.1}
.day span{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.day[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dayhead{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--muted)}
details.dn{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
details.dn summary{cursor:pointer;font-weight:600;font-size:14px}
details.dn ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
/* timeline */
.tl{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:62px 1fr;gap:12px;text-align:left;background:none;border:0;padding:0;width:100%;cursor:default}
.it.edit{cursor:pointer}
.it .t{font-size:12.5px;font-weight:600;color:var(--muted);padding-top:12px;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.it .b{border-left:2px solid var(--accent-line);padding:10px 0 14px 14px;position:relative;min-width:0}
.it .b::before{content:"";position:absolute;left:-6px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.it .ti{font-weight:600;font-size:15px}
.edhint{float:right;margin-left:8px;display:inline-flex;color:var(--faint);padding:2px}
.it.edit:hover .edhint{color:var(--accent)}
.it .no{font-size:13.5px;color:var(--muted);margin-top:2px}
.it .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.star{font-size:12px;font-weight:600;color:var(--good);border:1px solid color-mix(in srgb,var(--good) 40%,transparent);border-radius:999px;padding:2px 8px}
/* spend */
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li.tap{cursor:pointer}
.li .main{flex:1;min-width:0}
.li .ti{font-weight:600}
.li .sub{font-size:12.5px;color:var(--muted)}
.li .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.li .amt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.tag{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 6px;border:1px solid var(--accent-line);color:var(--fg)}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.grouphead{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;border-bottom:1px solid var(--accent-line);padding-bottom:4px}
/* todo */
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:0 0 auto}
.task .main{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.task.done .ti{text-decoration:line-through;color:var(--faint)}
.task .ti{font-weight:600;font-size:14.5px}
.task .sub{font-size:13px;color:var(--muted)}
.due{font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap;border:1px solid var(--line);border-radius:6px;padding:1px 6px;align-self:flex-start;margin-top:2px}
/* notes */
.audit{max-height:240px;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.audit .arow{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.35}
.audit .arow:last-child{border-bottom:0}
.audit .atext{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.audit .atime{font-size:12px;color:var(--muted);white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:7px 8px;border-radius:7px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent-line)}
details.note{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.note[open]{border-color:var(--accent-line)}
details.note summary{cursor:pointer;padding:12px 14px;font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
details.note summary::-webkit-details-marker{display:none}
details.note summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.note[open] summary::after{transform:rotate(-135deg)}
details.note ul{margin:0;padding:0 14px 6px 32px;display:flex;flex-direction:column;gap:8px;font-size:14px}
details.note .ed{padding:0 14px 12px}
/* trip */
.qr{background:#fff;padding:10px;border-radius:10px;width:max-content;max-width:100%;border:1px solid var(--line)}
.qr img,.qr canvas{display:block;max-width:100%}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px;cursor:pointer}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
/* sheet */
.sheet{position:fixed;inset:0;bottom:var(--kb,0px);z-index:50;transition:bottom .15s ease;display:flex;align-items:flex-end;justify-content:center;background:color-mix(in srgb,#000 45%,transparent)}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:min(90%,calc(var(--vvh,100dvh) - 24px));overflow:auto;border-radius:18px 18px 0 0;border-top:2px solid var(--accent);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.panel .ph{display:flex;align-items:center;gap:10px}
.panel .ph h2{font-size:18px;flex:1}
.x{border:0;background:var(--fill);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.f{display:flex;flex-direction:column;gap:5px}
.f label,.lab{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input:not([type=checkbox]),.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none}
.f textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.pick button[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.hint{font-size:12.5px;color:var(--muted)}
.res{display:flex;flex-direction:column;gap:8px}
.res .card{display:flex;flex-direction:column;gap:6px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

: "Momiji Tunnel (Momiji Kairō), Fujikawaguchiko", "note": "ride past Oishi Park to the west end first. Maple-lined path by the lake; leaves are gone by late Dec, but the path + Fuji view still work", "star": false, "time": "2:45–3:30", "title": "Momiji Tunnel (Momiji Kairō)"}, {"id": "c2aa1131", "map": "Oishi Park, Fujikawaguchiko", "note": "the classic Fuji-over-the-lake shot. Golden hour ~3:45, sunset ~4:35. Warm up at the **Natural Living Center** right there (café, soft serve)", "star": true, "time": "3:30–4:35", "title": "Back east to Oishi Park"}, {"id": "ec640e6b", "map": "", "note": "(~20 min), return bikes by ~5pm", "star": false, "time": "~4:40", "title": "Ride back along the lake"}, {"id": "8fa6c49e", "map": "", "note": "Night Fuji from the lakeshore if the sky's clear (bring a tripod or rest the camera on something)", "star": false, "time": "Evening", "title": "Hotel onsen, dinner"}, {"id": "3c0dbc2d", "map": "Kawaguchiko Station", "note": "", "star": false, "time": "", "title": "Omni Bus Red Line loops the east/north shore every ~15 min and stops near Oishi Park. Two-day pass ¥2,000 covers Dec 29 too"}, {"id": "737af94d", "map": "Kachi Kachi Ropeway, Fujikawaguchiko", "note": "(Mt Fuji Panoramic Ropeway), ~15 min from the station. 3-min ride up to a Fuji + lake viewpoint, ¥1,200 return, last ride down 17:20. Good sunset spot", "star": false, "time": "", "title": "Kachi Kachi Ropeway"}], "notes": ["**If it's icy, wet or windy (no bikes):**"], "order": 9, "title": "Osaka → Kawaguchiko"}, "2026-12-29": {"city": "Kawaguchiko → Tokyo", "date": "2026-12-29", "hotel": "Smile Hotel Shinagawa Sengakuji Ekimae, Mita 3-11-26, Minato-ku", "items": [{"id": "86e42eab", "map": "", "note": "Check the first Fujikyu train time the night before (taxi ~15 min if no early train)", "star": false, "time": "~6:15", "title": "Up early"}, {"id": "89fdf7c8", "map": "", "note": "(~15 min)", "star": false, "time": "~6:30", "title": "Fujikyu train Kawaguchiko → Shimoyoshida"}, {"id": "093153a3", "map": "Chureito Pagoda, Fujikawaguchiko", "note": "(Arakurayama Sengen Park), ~400 steps up. Pagoda + Fuji at sunrise, near-empty this early", "star": true, "time": "6:50–8:00", "title": "Chureito Pagoda"}, {"id": "5ec9a10c", "map": "Honcho Street Fujiyoshida", "note": "the shopping street with Fuji rising at the end, framed by shop signs + traffic lights. Early morning = fewer cars and people. ⚠️ **Shoot from the pavement, never stand in the road** — it's a live street, and it's residential, so keep it quiet", "star": false, "time": "8:00–8:30", "title": "Walk down (~10–15 min) to Honcho Street (Shimoyoshida)"}, {"id": "cbcf133e", "map": "", "note": "(~15 min). (Gekkōji Stn, a cute retro station, is nearby if it's closer)", "star": false, "time": "~8:30", "title": "Train back to Kawaguchiko from Shimoyoshida"}, {"id": "58f54fe2", "map": "Lawson Kawaguchiko Ekimae, Fujikawaguchiko", "note": "the \"Fuji above the Lawson roof\" shot. **2–3 min walk west of the station.** Stand on the far side of the road; there's a barrier there now that keeps you off the road but the view is open. ⚠️ Cross only at the traffic-light crossing (~80m along), don't use the car park (customers only), stay off the dental clinic forecourt. Nov–Feb Fuji is usually visible most of the day", "star": false, "time": "~9:00", "title": "Lawson Kawaguchiko Ekimae"}, {"id": "a45b185d", "map": "", "note": "", "star": false, "time": "9:15–10:00", "title": "Breakfast near the station, check out, collect bags"}, {"id": "73ba45c1", "map": "", "note": "(~2h, book ahead on highwaybus.com, holiday slots sell out). Inbound to Tokyo should be lighter than outbound this week, but allow for delays", "star": false, "time": "~10:30", "title": "Highway bus Kawaguchiko → Shinjuku"}, {"id": "45ad88ad", "map": "Takanawa Gateway, Tokyo", "note": "(Yamanote, ~25 min) → 9 min walk to the hotel. Early bag drop (✅ hotel confirmed they hold bags); check-in from 3pm, collect forwarded luggage", "star": false, ime": "9:00–10:00", "title": "Hōkokuji bamboo grove temple"}, {"id": "e5159a9e", "map": "", "note": "", "star": false, "time": "10:00–10:30", "title": "Walk/bus back toward the centre"}, {"id": "d739df7f", "map": "Tsurugaoka Hachimangu, Kamakura", "note": "(free), Kamakura's main shrine", "star": false, "time": "10:30–11:30", "title": "Tsurugaoka Hachimangu"}, {"id": "319dea6e", "map": "Komachi-dōri, Kamakura", "note": "", "star": false, "time": "11:30–12:45", "title": "Komachi-dōri street food walk back to the station, then lunch: shirasu-don (whitebait rice bowl, the local dish)"}, {"id": "c15f4145", "map": "", "note": "(5 min). Enoden day pass ¥800 if riding 3+ times", "star": false, "time": "12:45", "title": "Enoden to Hase"}, {"id": "68fac2df", "map": "Kōtoku-in Great Buddha, Kamakura", "note": "", "star": false, "time": "1:00–1:45", "title": "Kōtoku-in Great Buddha (¥300, +¥50 to go inside)"}, {"id": "894977be", "map": "Hasedera, Kamakura", "note": "", "star": false, "time": "1:45–2:45", "title": "Hasedera (¥400), hillside temple with a sea view"}, {"id": "e18a4671", "map": "Kamakurakōkōmae", "note": "(the Slam Dunk anime crossing; expect crowds, quick photo)", "star": false, "time": "3:00–3:30", "title": "Enoden → Kamakurakōkōmae crossing"}, {"id": "717038bd", "map": "Shichirigahama beach, Kamakura", "note": "Fuji silhouette across the bay on a clear evening", "star": true, "time": "3:45–4:35", "title": "Shichirigahama beach sunset"}, {"id": "cefca79a", "map": "", "note": "(or on to Fujisawa) → JR Yokosuka line to Shinagawa → hotel by ~6:00–6:30", "star": false, "time": "~5:00", "title": "Enoden back to Kamakura"}, {"id": "4db93afd", "map": "", "note": "", "star": false, "time": "Evening", "title": "Dinner back in Tokyo"}], "notes": ["**Why this day:** Jan 1–3 Kamakura's main shrine (Tsurugaoka Hachimangu) is one of the busiest New Year shrines in the Tokyo area, and Dec 31 is your shopping day. Dec 30 is a normal weekday with everything open.", "**From the hotel:** walk/1 stop to **Shinagawa** → **JR Yokosuka line → Kamakura** (~50 min direct, ~¥940, IC card). Leave ~8:00.", "**Daylight:** sunset ~4:35. Great Buddha closes 5pm, Hasedera last entry 4:30pm.", "**Optional add-on: Enoshima** (island with shrines, caves, sea views). Adds ~2h. Only fits if you drop Hōkokuji or Hasedera."], "order": 11, "title": "Kamakura day trip"}, "2026-12-31": {"city": "Tokyo", "date": "2026-12-31", "hotel": "Smile Hotel Shinagawa Sengakuji Ekimae, Mita 3-11-26, Minato-ku", "items": [{"id": "353087d0", "map": "", "note": "", "star": false, "time": "7:30", "title": "Toei Asakusa line Sengakuji → Higashi-Ginza, walk ~8 min to Tsukiji (~20 min)"}, {"id": "d835c0d3", "map": "", "note": "(beef / offal rice bowl, ~¥1,000, standing). Dec 31 is the market's busiest day of the year, so come early and don't linger", "star": false, "time": "8:00–9:00", "title": "Breakfast at Kitsuneya, Tsukiji Outer Market"}, {"id": "7079b63e", "map": "", "note": "", "star": false, "time": "9:00", "title": "Hibiya line Tsukiji → Ebisu, then JR Yamanote 1 stop → Shibuya (~30 min)"}, {"id": "8b698d1a", "map": "Shibuya Crossing, Tokyo", "note": "Best view from the Shibuya Station walkway (Mark City side) or the Magnet building rooftop", "star": false, "time": "10:00–10:45", "title": "Shibuya Crossing + Hachikō"}, {"id": "0bcef17f", "map": "", "note": "Pokémon Center Shibuya + Nintendo TOKYO (6F). Do it today, Parco is shut Jan 1–2", "star": false, "time": "10:45–12:00", "title": "Shibuya Parco"}, {"id": "5b18c44f", "map": "", "note": "Gyukatsu Motomura, Shibuya (sear-it-yourself beef cutlet, 4.9★). Queue, but they take your order while you wait. Two branches a few minutes apart, pick the shorter line", "star": false, "time": "12:00–1:00", "title": "Lunch"}, {"id": "c0fbc2d3", "map": "Miyashita Park, Tokyo", "note": "", "star": false, "time": "1:00–1:30", "title": "Miyashita Park (rooftop park on top of a mall)"}, {"id": "9621d9c8", "map": "Cat Street, Tokyo", "note": "(quiet back street, independent fashion + cafés). Snack stop: Luke's Lobster on Cat Street → Omotesando", "star": true, "time": "1:30–2:45", "title": "Walk Cat Street"}, {"id": "83c3398e", "map": "Takeshita Street, Tokyo", "note": "(crêpes, kawaii shops) + Laforet Harajuku. Early dinner / snack in Harajuku: Roast Beef Ohno (roast beef bowl, 4.7★) or Spontini (thick Milan pizza)", "star": false, "time": "2:45–4:30", "title": "Takeshita Street"}, {"id": "55d66366", "map": "", "note": "(~25 min). Rest at the hotel", "star": false, "time": "4:30", "title": "JR Yamanote Harajuku → Takanawa Gateway"}, {"id": "f960f29e", "map": "", "note": "toshikoshi soba (New Year's Eve soba, for a long life)", "star": false, "time": "7:00", "title": "Light supper near the hotel"}, {"id": "a82b965f", "map": "", "note": "Toei Asakusa line Sengakuji → Daimon (2 stops), walk 5 min", "star": false, "time": "10:15", "title": "Leave the hotel"}, {"id": "179d857a", "map": "", "note": "Monks ring the big bell 108 times around midnight, Tokyo Tower lit behind the main gate. Some years white balloons go up at 12:00. Thousands of people, it's cold, wear everything", "star": false, "time": "10:30 → 12:30am", "title": "Countdown at Zōjō-ji Temple, right under Tokyo Tower"}, {"id": "04662c63", "map": "", "note": "(~35 min) or train from Daimon if it's not packed", "star": false, "time": "~12:45am", "title": "Walk back to the hotel"}], "notes": ["Shops close early today (~6pm), so shop in the daytime and rest before midnight.", "*Alt morning:* **Ameyoko (Ueno)** year-end market street, very busy on Dec 31. *Takano Fruit Parlour* moves here if it's closed on Jan 2."], "order": 12, "title": "Shibuya → Harajuku on foot + countdown"}, "2027-01-01": {"city": "Tokyo", "date": "2027-01-01", "hotel": "Smile Hotel Shinagawa Sengakuji Ekimae, Mita 3-11-26, Minato-ku", "items": [{"id": "047c2c92", "map": "", "note": "", "star": false, "time": "9:00", "title": "Slow breakfast (konbini / hotel area)"}, {"id": "e7d22348", "map": "", "note": "", "star": false, "time": "9:30", "title": "Shinagawa → JR Keihin-Tōhoku 1 stop → Ōimachi → Tokyu Ōimachi line → Todoroki (~40 min)"}, {"id": "79e0de56", "map": "Todoroki Valley, Tokyo", "note": "forest ravine path along a stream, with a small waterfall and Todoroki Fudōson temple at the end, inside Tokyo. Free, almost no tourists, and open on New Year's Day (unlike the gardens)", "star": true, "time": "10:15–11:30", "title": "Todoroki Valley"}, {"id": "fcbdce62", "map": "", "note": "", "star": false, "time": "11:30–12:30", "title": "Tokyu Ōimachi line → Jiyūgaoka → Tokyu Tōyoko line → Shibuya, then Hanzōmon line → Oshiage. Or Ōimachi → Shinagawa → Toei Asakusa line → Oshiage (~50–60 min)"}, {"id": "5c842f9a", "map": "", "note": "(open Jan 1)", "star": false, "time": "12:30–1:30", "title": "Lunch at Solamachi's restaurant floors"}, {"id": "6599002c", "map": "Tokyo Skytree Town / Solamachi", "note": "Pokémon Center Skytree Town, Donguri Republic (Ghibli shop), Japanese snacks floor. Skytree deck optional around sunset (~4:30), expect a queue", "star": false, "time": "1:30–5:30", "title": "Tokyo Skytree Town / Solamachi"}, {"id": "d9fedb62", "map": "", "note": "", "star": false, "time": "5:30–7:00", "title": "Dinner at Solamachi's restaurant floors, or a wagyu yakiniku buffet (chains are open on New Year's Day)"}, {"id": "a979f12a", "map": "", "note": "(~30 min)", "star": false, "time": "~7:15", "title": "Toei Asakusa line Oshiage → Sengakuji, direct"}], "notes": ["Department stores and small shops are shut. Big malls, electronics stores and chains are open. Late night yesterday, so start slow.", "*Swaps:* **Odaiba** (life-size Unicorn Gundam at DiverCity, Rainbow Bridge views) instead of Todoroki · **Ikebukuro Sunshine City** (Pokémon Center Mega Tokyo, ~11am–7pm) instead of Skytree · **Spa LaQua** (Tokyo Dome City) if it's cold or wet · **Yodobashi Akiba** is open with lucky bags · (teamLab Planets in Toyosu is open every day if you change your mind)", "⚠️ Gardens are closed Dec 29–Jan 1, and big shrines are packed today."], "order": 13, "title": "New Year's Day: Todoroki Valley → Skytree"}, "2027-01-02": {"city": "Tokyo", "date": "2027-01-02", "hotel": "Smile Hotel Shinagawa Sengakuji Ekimae, Mita 3-11-26, Minato-ku", "items": [{"id": "c32404c8", "map": "", "note": "", "star": false, "time": "8:30", "title": "Breakfast"}, {"id": "f552770b", "map": "", "note": "(~25 min)", "star": false, "time": "9:15", "title": "Takanawa Gateway → JR Yamanote → Shinjuku"}, {"id": "8bcb49d6", "map": "", "note": "(lucky bags) at Isetan, Lumine, Odakyu. Queues start before opening at popular brands", "star": false, "time": "10:00–12:00", "title": "New Year sales + fukubukuro"}, {"id": "6787b248", "map": "Omoide Yokocho, Tokyo", "note": "Omoide Yokocho (lantern-lit yakitori alley by the station) if it's open, or the Isetan basement food hall", "star": false, "time": "12:00–1:00", "title": "Lunch"}, {"id": "8e21352f", "map": "Tokyo Metropolitan Government Building", "note": "", "star": false, "time": "1:00–2:00", "title": "Tokyo Metropolitan Government Building free observatory (45F, Fuji views on a clear day), 10 min walk west of the station. Check it's open over New Year. Or more shopping"}, {"id": "bac3eb2e", "map": "Takano Fruit Parlour, Tokyo", "note": "(Shinjuku Takano main store, 5 min from the east side of the station). Strawberry parfaits. Mid-afternoon is quieter. Check its New Year days first", "star": false, "time": "2:00–3:00", "title": "Takano Fruit Parlour"}, {"id": "7d059cfa", "map": "", "note": "", "star": false, "time": "3:00", "title": "JR Yamanote Shinjuku → Nippori (~25 min)"}, {"id": "7f2942ba", "map": "Yanaka Ginza, Tokyo", "note": "", "star": true, "time": "3:30–5:00", "title": "Yanaka Ginza old-Tokyo shopping street, cat shops, croquettes and snacks. Yūyake Dandan (\"sunset steps\") at the top of the street, right at sunset (~4:30)"}, {"id": "29b52413", "map": "", "note": "", "star": false, "time": "5:15", "title": "JR Yamanote Nippori → Kanda (~10 min)"}, {"id": "f3debf15", "map": "", "note": "Yakiniku Kanda Seinikuten (\"Kanda Butcher Shop\", affordable wagyu yakiniku, opens 4pm on weekends). Covers the wagyu night", "star": false, "time": "5:30–7:30", "title": "Dinner"}, {"id": "8f6c2454", "map": "", "note": "", "star": false, "time": "~7:45", "title": "JR Yamanote Kanda → Takanawa Gateway (~20 min)"}], "notes": ["*Swap:* **Nakano Broadway** ⭐ (collector heaven, 5 min from Shinjuku on the JR Chūō line) or **Shimokitazawa** ⭐ (vintage) instead of Yanaka. Some small shops may still be closed for New Year. Tsukiji is closed until Jan 4."], "order": 14, "title": "Shinjuku lucky bags → Yanaka at sunset"}, "2027-01-03": {"city": "Tokyo", "date": "2027-01-03", "hotel": "Smile Hotel Shinagawa Sengakuji Ekimae, Mita 3-11-26, Minato-ku", "items": [{"id": "c29f9a47", "map": "", "note": "", "star": false, "time": "9:00", "title": "Breakfast"}, {"id": "c87b82c0", "map": "", "note": "", "star": false, "time": "9:45", "title": "Takanawa Gateway → JR Yamanote / Keihin-Tōhoku → Akihabara (~20 min)"}, {"id": "6f8653d1", "map": "Akihabara, Tokyo", "note": "Pokémon cards at Hareruya 2 Akihabara Tower + the card shops around it, Yodobashi Akiba, gachapon floors, retro games", "star": false, "time": "10:30–1:00", "title": "Akihabara"}, {"id": "621de359", "map": "Kizuna Sushi, Tokyo", "note": "Kizuna Sushi, Akihabara (all-you-can-eat, ~¥4,000–5,000, order on a tablet. Mixed reviews: huge choice, average quality)", "star": false, "time": "1:00–2:00", "title": "Lunch"}, {"id": "9dae2017", "map": "", "note": "Pokémon Center Tokyo DX + Pokémon Café (Café needs a booking). Walk ~20 min or Ginza line", "star": false, "time": "2:00–3:00", "title": "Nihonbashi"}, {"id": "81e80799", "map": "Ginza, Tokyo", "note": "Chūō-dōri (often a car-free pedestrian street on weekend afternoons, check), Ginza Six, Itoya (12-floor stationery), Uniqlo flagship. Or take a queue number at Sushi no Midori", "star": false, "time": "3:00–5:00", "title": "Ginza"}, {"id": "62172088", "map": "", "note": "(~20 min)", "star": false, "time": "5:15", "title": "Toei Asakusa line Higashi-Ginza → Togoshi, direct"}, {"id": "2007f0d9", "map": "Togoshi Ginza, Tokyo", "note": "Tokyo's longest shopping street (~1.3 km, ~400 shops), very local", "star": true, "time": "5:45–7:30", "title": "Togoshi Ginza dinner + snacks"}, {"id": "7c6d9edc", "map": "", "note": "(3 stops, ~8 min)", "star": false, "time": "~7:45", "title": "Toei Asakusa line Togoshi → Sengakuji"}, {"id": "4ad45da1", "map": "", "note": "Spend leftover IC card balance at the konbini. Bags ready for a 5:30am start", "star": false, "time": "Night", "title": "Pack"}], "notes": ["Almost everything is open again today. Last full day."], "order": 15, "title": "Akihabara → Nihonbashi → Ginza → Togoshi Ginza"}, "2027-01-04": {"city": "Tokyo → home", "date": "2027-01-04", "hotel": "", "items": [{"id": "74e7bf64", "map": "", "note": "Checkout is just leaving the key (pay any extras the night before)", "star": false, "time": "5:00", "title": "Wake up"}, {"id": "913b1f2c", "map": "", "note": "", "star": false, "time": "5:30–5:45", "title": "Leave the hotel"}, {"id": "4fdb5fd2", "map": "", "note": "Sengakuji → Narita Airport direct on a Keisei Access Express through-train (~1h30, ~¥1,500, IC). Check the earliest direct train the week before. Option B: walk to Shinagawa → Narita Express (~1h10, reserved)", "star": false, "time": "~5:45", "title": "Option A"}, {"id": "df7d7ec0", "map": "", "note": "", "star": false, "time": "~7:00–7:15", "title": "Arrive Narita"}, {"id": "bfd619a4", "map": "", "note": "(new system from Nov 1, 2026): they check your passport + the tax-free items; the refund goes back to your card in 1–2 weeks. Keep items + receipts together", "star": false, "time": "7:15–7:45", "title": "Tax refund at customs before checking in your suitcase"}, {"id": "36f2e24a", "map": "", "note": "", "star": false, "time": "7:45–8:30", "title": "Check in, bag drop, security"}, {"id": "d0ca6bee", "map": "", "note": "", "star": false, "time": "9:45", "title": "✈ NRT → KUL (arr. 16:55)"}], "notes": ["*(Spare ideas: teamLab Planets, Golden Gai bars at night, Kagurazaka, Daikanyama, Tokyo Tower at night)*"], "order": 16, "title": "Narita, 09:45 flight"}}, "notes": {"n00": {"group": "Heads-up", "lines": ["**Sunset is early: ~4:30pm in Tokyo, ~4:50pm in Kyoto/Osaka.** Temples and gardens usually close 4:30–5pm. Do outdoor things in the morning and leave shopping/food for after dark.", "**Restaurants:** last order is often 30–60 min before closing. Many small places are **cash only**. A table for 4 is normal, but at busy counters you may get split into 2+2.", "**Hardly any public bins.** Carry a small plastic bag for rubbish, and use the bins at konbini.", "**No tipping.** Leaving money on the table can get the staff running after you to return it.", "**Eating while walking** is frowned on in many old streets (Kamakura Komachi-dōri, Asakusa Nakamise, parts of Kyoto). Eat standing next to the stall you bought from.", "**Big coin lockers go first.** At Kyoto Stn and Kawaguchiko, get there early or use ecbo cloak.", "**Suitcases 160cm+** (W+H+D) on the shinkansen need the oversized-baggage seats booked. Otherwise there's a fee and you may have to move.", "**Tax-free (new from Nov 1, 2026):** pay full price, show your passport (min ¥5,000 per shop per day), and customs at Narita checks it on Jan 4. Keep all tax-free items + receipts together.", "**Mondays (Dec 21, Dec 28, Jan 4):** many museums close on Mondays. Temples, shops and parks are fine.", "**Weekends (Dec 26–27, Jan 2–3)** are busier everywhere, especially Pokémon Centers, Dotonbori and Shibuya."], "order": 0, "title": "Whole trip"}, "n01": {"group": "Heads-up", "lines": ["**Christmas Eve is a big couples' date night in Japan.** Nicer restaurants in Osaka book out for Dec 24 and 25 dinner. Book if you want somewhere specific, or keep it casual (Dotonbori street food, ramen, kushikatsu are fine).", "**KFC is a Christmas tradition here**, so ironically KFC is packed with people collecting pre-ordered buckets.", "**Christmas decorations come down on Dec 25 night**, and New Year decorations go up on Dec 26. Christmas illuminations (Osaka Midosuji, Grand Front) are best Dec 24–25."], "order": 1, "title": "Christmas (Dec 24–25)"}, "n02": {"group": "Heads-up", "lines": ["**Nishiki Market:** stalls start closing from ~4–5pm, and individual shops close on different weekdays. Dec 22 (Tue) is fine.", "**Dec 23 is a Wednesday:** some small shops close on Wednesdays. Temples are fine.", "**Gion photo rule:** photography is **banned on Gion's private lanes** (signs posted, fine up to ¥10,000). Don't chase or photograph geiko/maiko up close. Gion Shirakawa and Hanamikoji main street are fine.", "**Kyoto buses get packed and slow.** Use trains + walking where you can.", "**Kimono return time:** check it before booking; some shops want them back by ~5pm, which clashes with dusk at Gion Shirakawa.", "**Uji (Dec 24):** shops along the Byodoin approach close ~5pm. Matcha places are busiest late morning to early afternoon."], "order": 2, "title": "Kyoto (Dec 22–24)"}, "n03": {"group": "Heads-up", "lines": ["**Katsuoji (Dec 25):** no train. Bus No. 30 from Minoh-Kayano (¥800), then a taxi from the temple to Minoh Falls (~¥1,500 per car). Details in japan_transport.md.", "**MooKEN cream puffs** are closed Mon–Tue and sell out by early afternoon. Dec 25–27 work.", "**Kuromon Market** is pricey and touristy, and stalls wind down by mid-afternoon. Go before noon.", "**Local sushi in Osaka, Dec 25–27** is one of the safer slots of the trip (see japan_food.md).", "**Dec 27 night:** forward suitcases to the Tokyo hotel. Yamato needs the hotel address in Japanese and the guest name on the booking. Confirm Dec 29 delivery at the counter."], "order": 3, "title": "Osaka (Dec 24–28)"}, "n04": {"group": "Heads-up", "lines": ["**Mishima → Kawaguchiko bus needs a seat reservation** (10:20, ¥2,700). Book online when it opens.", "**Dec 28 is the start of the New Year travel rush.** Trains and buses out of the big cities are busy, and Fuji-view rooms sell out. Hotel ✅ booked: SEVEN HOUSE, 5 min from Kawaguchiko Stn. It's **self check-in**, so save the check-in instructions offline before you arrive.", "**Fuji is clearest in the morning.** It often clouds over by early afternoon, so don't save the best photo spot for 3pm.", "**Kawaguchiko shuts early.** Many restaurants close by ~8pm and shops by ~5–6pm. Plan dinner early or buy from a konbini. Hōtō (the local noodle stew) places can have queues at 6pm.", "**E-bikes are a no-go if it's icy or snowing.** Backup: Omni bus 2-day pass (¥2,000) + Kachi Kachi Ropeway (last ride down 17:20).", "**Return e-bikes by ~5pm.** It's dark soon after 4:30, and it gets very cold by the lake.", "**Chureito sunrise (Dec 29):** ~400 steps that can be icy in the dark. Bring a phone torch and gloves.", "**Lawson Fuji spot:** no stopping on the road or the crossing, and there may be a barrier or guards. Quick photo from the pavement, then move on.", "**Dec 29 bus to Shinjuku:** traffic into Tokyo on Dec 29 is usually lighter than the outbound rush, but delays happen. **Book the coin ring for 3:00–3:30pm or later** so you're not racing."], "order": 4, "title": "Kawaguchiko (Dec 28–29)"}, "n05": {"group": "Heads-up", "lines": ["**Most sushi counters / small restaurants** — ~Dec 30 – Jan 4 (varies, check each place)", "**Toyosu fish market** — Around New Year (~Dec 31–Jan 4, check the market calendar)", "**Tsukiji Outer Market** — ~Jan 1–4", "**Kappabashi Kitchen Street** — Many shops from ~Dec 30", "**Gardens (Hamarikyu, Kiyosumi etc.)** — Dec 29 – Jan 1", "**Department stores, 109, Lumine, Parco** — Jan 1 (reopen Jan 2 with sales)", "**Shibuya Parco** (Pokémon Center + Nintendo TOKYO) — Jan 1–2, so go Dec 31", "**Banks** — Dec 31 – Jan 3", "**Japan Post ATMs** — From ~21:00 Dec 31 for a few days. Use **7-Eleven ATMs** (open 24/7)"], "order": 5, "title": "What's closed"}, "n06": {"group": "Heads-up", "lines": ["**Get cash before Dec 31.** 7-Eleven ATMs still work, but don't leave it to the last day.", "**Dec 31: shops close early** (many by ~6pm), and restaurants get busy with year-end parties. Eat dinner early.", "**Dec 31 trains:** most lines no longer run all night. The countdown at Zōjō-ji is ~35 min walk from the hotel, so you're fine either way.", "**Shibuya on NYE:** the ward discourages countdown crowds and bans street drinking around the crossing. Not a fun countdown spot anymore.", "**Shrines on Jan 1–3 (hatsumode):** Meiji Jingu, Sensō-ji and Tsurugaoka Hachimangu (Kamakura) get **hours-long queues**. That's why Kamakura is on Dec 30 and Asakusa on Dec 29.", "**Jan 1: plan around what's open** (malls, Skytree Solamachi, Sunshine City, Odaiba, Yodobashi, chains, konbini). Don't count on small local restaurants.", "**Jan 2: lucky bag (fukubukuro) queues** start early at department stores. Popular shops sell out in the first hour.", "**Takano Fruit Parlour:** check its New Year days before Jan 2. Backup is Dec 31 morning."], "order": 6, "title": "What to watch out for"}, "n07": {"group": "Heads-up", "lines": ["**Sushi:** most small counters close for New Year (~Dec 30–Jan 4), and Toyosu market is shut too. **Safer slots: Osaka Dec 25–27, or Tokyo Dec 29 dinner.** Local picks are in japan_food.md.", "**Wagyu yakiniku buffets** are mostly chains and stay open through New Year, so they're a good Jan 1 dinner.", "**Pokémon Cafe** slots open ~31 days ahead and go in minutes."], "order": 7, "title": "Food bookings"}, "n08": {"group": "Heads-up", "lines": ["**It's the end of the New Year holiday.** Narita is busy, and trains into the airport can be full.", "**Leave the hotel by ~05:30–05:45** and be at Narita by ~07:00 for the 09:45 flight.", "**Tax refund at customs before you check in your suitcase**, because they may want to see the items. Allow extra time.", "**Hotel checkout is 10am**, but you'll be gone long before. Pay any extras the night before.", "**Use up IC card balance** on drinks/konbini on Jan 3. A Welcome Suica can't be refunded."], "order": 8, "title": "Jan 4 — flying home"}, "n09": {"group": "Transport", "lines": ["**Nov 22, 9:00am** — Shinkansen **Tokyo → Kyoto**, Dec 22, ~10:30 **Nozomi** (~¥14,000) · smartEX app · Steps below", "**Nov 28, 9:00am** — Shinkansen **Shin-Osaka → Mishima**, Dec 28, **Hikari** arriving Mishima by ~9:50 (~¥11,000) · smartEX app · Nozomi does NOT stop at Mishima", "**When it opens (~Nov 28)** — Bus **Mishima → Kawaguchiko**, Dec 28, **10:20** (¥2,700) · Fujikyu online booking · **Seat reservation required** on these limited express buses. Online is cheaper than at the counter", "**~Nov 29** — Highway bus **Kawaguchiko → Shinjuku**, Dec 29, ~10:30 (~¥2,200) · highwaybus.com · Holiday seats sell out", "**Day before** — Narita Express (only if Option B on Jan 4) · JR East"], "order": 9, "title": "Tickets to buy ahead"}, "n10": {"group": "Transport", "lines": ["1. Open smartEX at the time above (seats only finalise one month ahead; earlier = provisional, no seat map).", "2. Pick the date, **4 passengers**, \"By time\".", "3. Choose the train (Nozomi for Kyoto, **Hikari** for Mishima), **reserved seats**.", "4. Pick **4 seats together** on the seat map. If any suitcase is **160cm+** (W+H+D), pick the **last-row seats with the oversized-baggage area** (free, must be booked).", "5. Pay by card, save the QR codes. Sit on the **right side (seat E)** to Mishima for the Fuji view."], "order": 10, "title": "smartEX booking steps (both shinkansen)"}, "n11": {"group": "Transport", "lines": ["Measured on the map, walking time at a normal pace. Kyoto is approximate (the exact building didn't pin, so it's measured from the middle of Mibubojō-chō).", "**Tokyo Bay stay** (Irifune 4-9-5, Urayasu) — **Shin-Urayasu** · JR Keiyō line (Tokyo Stn, Maihama/Disney) · **~750 m, ~9 min**", "**Kyoto** (Mibubojō-chō 14-2) — **Ōmiya** · Hankyu (Kawaramachi, Osaka-Umeda) · **~400 m, ~5 min**", "**Shijō-Ōmiya** — Randen tram (Arashiyama) · ~400 m, ~5 min", "**Tambaguchi** — JR Sagano line (Kyoto Stn, 1 stop) · ~1.4 km, ~17 min", "**Osaka** (Shinmachi 2-17-5) — **Nishi-Ōhashi** · Nagahori Tsurumi-ryokuchi line (Osaka Castle, 1 stop to Shinsaibashi) · **~350 m, ~5 min**", "**Yotsubashi** — Yotsubashi line (Umeda, Namba); underground link to Shinsaibashi · ~750 m, ~10 min", "**Shinsaibashi** — **Midōsuji line** (Shin-Osaka, Minoh-Kayano, Namba, Tennōji) · ~1.1 km, ~14 min", "**Kawaguchiko** (SEVEN HOUSE) — **Kawaguchiko Stn** · Fujikyu train, buses · **~280 m, ~4 min**", "**Tokyo** (Smile Hotel, Mita 3-11-26) — **Sengakuji** · Toei Asakusa line, Keikyu (Shinagawa 1 stop, Narita direct) · **~350 m, ~4 min**", "**Takanawa Gateway** — JR Yamanote, Keihin-Tōhoku · ~750 m, ~9 min", "**Shinagawa** — JR, shinkansen, N'EX · ~1.8 km, ~22 min (take Keikyu 1 stop from Sengakuji instead)", "**Osaka tip:** for the Midōsuji line, either walk 14 min to Shinsaibashi, or walk 5 min to **Nishi-Ōhashi** and ride the Nagahori line **1 stop to Shinsaibashi**, then change. On Dec 28 you only carry daypacks (suitcases are forwarded to Tokyo on Dec 27), so the train is fine."], "order": 11, "title": "Hotel → nearest stations (walking)"}, "n12": {"group": "Transport", "lines": ["**Suitcases → hotel** — **Yamato counter** at Narita arrivals · ~¥2,000–2,500/bag. Ask if they can reach Urayasu the **same day**. If not, keep an overnight bag with you", "**IC cards** — Narita B1 station machines/counter · Load ~¥3,000 each", "**Narita → Asakusa** — **Keisei Access Express** (Narita Sky Access line), direct · ~1h, ~¥1,400, IC", "**Asakusa → Nakameguro** — Ginza line → Ginza, change to **Hibiya line** → Nakameguro · ~40 min, ~¥260, IC", "**Nakameguro → Ginza** — **Hibiya line**, direct · ~20 min, ~¥210, IC", "**Ginza → hotel** — **Hibiya line** → Hatchōbori (3 stops), change to **JR Keiyō line** → **Shin-Urayasu**, walk ~10 min · ~35 min total, ~¥400, IC"], "order": 12, "title": "Dec 20 (Sun): Narita → Tokyo → Urayasu"}, "n13": {"group": "Transport", "lines": ["**Hotel → DisneySea** — Walk to Shin-Urayasu → **JR Keiyō line** 1 stop → **Maihama** → **Disney Resort Line monorail** → Tokyo DisneySea Stn · ~25 min, ~¥160 + monorail ~¥260. (Check if the hotel runs a shuttle bus)", "**Back** — Same in reverse · Last monorails run after the park closes"], "order": 13, "title": "Dec 21 (Mon): DisneySea"}, "n14": {"group": "Transport", "lines": ["**Hotel → Tokyo Stn** — Walk to Shin-Urayasu → **JR Keiyō line** to Tokyo (end of the line). Leave ~8:30–8:45 to skip rush hour · ~20 min, ~¥300, IC. The Keiyō platforms are deep underground: **allow 10–15 min to walk** to the shinkansen gates", "**Friends (Shinagawa) → Tokyo Stn** — JR Yamanote / Keihin-Tōhoku · ~10 min, ~¥170, IC. (Or they board the same Nozomi at **Shinagawa**, 7 min later)", "**Tokyo → Kyoto** — **Nozomi ~10:30** (booked Nov 22) · ~2h15, arr. ~12:45", "**Kyoto Stn → hotel (Mibu)** — **Taxi** (split 4) · ~15 min, ~¥1,800/car. Or JR Sagano line 1 stop to **Tambaguchi**, walk ~17 min", "**Hotel → Kinkaku-ji** — **Taxi** · ~20 min, ~¥2,500/car", "**Kinkaku-ji → Nishiki Market** — **Taxi** · ~25 min, ~¥2,800/car. (Bus 12/205 is cheaper but slow and packed)", "**Nishiki → Pontocho** — Walk · 5–10 min", "**Pontocho → hotel** — **Hankyu line** Kyoto-Kawaramachi → **Ōmiya** (2 stops), walk ~8 min · ~10 min, ~¥200, IC"], "order": 14, "title": "Dec 22 (Tue): Tokyo → Kyoto"}, "n15": {"group": "Transport", "lines": ["**Hotel → Fushimi Inari** (dawn) — **Taxi** (best at 7am, split 4) · ~20 min, ~¥2,500/car. Train option: walk ~17 min to **Tambaguchi** → JR 1 stop to **Kyoto** → **JR Nara line** 2 stops → **Inari** (~35 min total, ~¥200)", "**Fushimi → kimono shop** — **Keihan line** Fushimi-Inari → **Kiyomizu-Gojō** (~10 min), walk/taxi up the hill · ~¥220, IC. Or taxi ~15 min", "**Higashiyama → Gion** — Walk · It's all downhill", "**Gion → hotel** — **Hankyu** Kyoto-Kawaramachi → **Ōmiya** · ~10 min, ~¥200, IC"], "order": 15, "title": "Dec 23 (Wed): Fushimi Inari + Higashiyama"}, "n16": {"group": "Transport", "lines": ["**Do it like this:** take the bags with you in the morning, lock them at **Kyoto Station**, and pick them up on the way to Osaka. No going back to the hotel.", "**Hotel → Kyoto Stn (with bags)** — **Taxi** (Tambaguchi is a 17-min walk, too far with bags) · ~10–15 min, ~¥1,500/car", "**Bags** — **Coin lockers** at Kyoto Stn (big ones go first, be there by ~9:00) · ~¥700/locker. Backup: ecbo cloak", "**Kyoto → Uji** — **JR Nara line** to **Uji** · ~20–30 min, ~¥240, IC", "**Uji → Kyoto** — JR Nara line back · ~25 min, ~¥240", "**Kyoto → Osaka** — **JR Special Rapid** to **Osaka Stn** · ~28 min, ~¥580, IC. (Shinkansen isn't worth it: Shin-Osaka is further from the hotel)", "**Osaka Stn → hotel** — Walk to **Nishi-Umeda** → **Yotsubashi line** → **Yotsubashi** (3 stops), walk ~5 min · ~15 min, ~¥240, IC. Taxi ~15 min ~¥2,000/car with bags"], "order": 16, "title": "Dec 24 (Thu): Uji → Osaka"}, "n17": {"group": "Transport", "lines": ["**Hotel → Minoh-Kayano** — Walk ~14 min to **Shinsaibashi** (or Nishi-Ōhashi → Nagahori line 1 stop) → **Midōsuji line** straight through to **Minoh-Kayano** (check the train says Minoh-Kayano) · ~40 min, ~¥500, IC", "**Minoh-Kayano → Katsuoji** — **Hankyu Bus No. 30**, stop 8 · ~25 min, ¥800, IC, 2–3 an hour. Taxi: ~20 min, ~¥3,400/car (stand across from stop 8)", "**Katsuoji → Minoh Falls** — **Taxi** from the temple's taxi stand / free call phone → falls upper car park · ~10 min, ~¥1,500/car, then ~10 min walk", "**Falls → Minoo Stn** — **Walk downhill** along the river trail · ~40 min", "**Minoo → Umeda** — **Hankyu Minoo line** → Ishibashi-handai-mae, change → **Hankyu Takarazuka line** → Osaka-Umeda · ~30 min, ~¥280, IC", "**Umeda → Tenjinbashi (lunch)** — Tanimachi line Higashi-Umeda → Tenjimbashisuji 6-chōme, or walk ~20 min · ~5 min, ~¥190", "**Umeda → hotel** — **Yotsubashi line** Nishi-Umeda → Yotsubashi · ~10 min, ~¥240"], "order": 17, "title": "Dec 25 (Fri): Katsuoji + Minoh → Umeda"}, "n18": {"group": "Transport", "lines": ["**Hotel ↔ Dotonbori / Shinsaibashi / Amemura** — Walk · 5–15 min", "**Hotel → Kuromon / Den-Den Town** — Walk ~25 min, or Yotsubashi line → Namba, then walk · ~¥190"], "order": 18, "title": "Dec 26 (Sat): Minami"}, "n19": {"group": "Transport", "lines": ["**Hotel → Osaka Castle** — Walk to **Nishi-Ōhashi** → **Nagahori Tsurumi-ryokuchi line** → **Morinomiya** (direct), walk ~10 min · ~15 min, ~¥240, IC", "**Castle → Shinsekai** — **Tanimachi line** Tanimachi 4-chōme → **Tennōji**, walk ~10 min · ~10 min, ~¥240", "**Shinsekai → Abeno Harukas** — Walk · ~10 min (it's at Tennōji)", "**Tennōji → hotel** — **Midōsuji line** → Shinsaibashi, walk · ~15 min, ~¥240", "**Night: luggage** — **Yamato** at the hotel desk → Smile Hotel Shinagawa Sengakuji Ekimae (✅ hotel confirmed they'll hold bags) · ~¥2,000–2,500/bag. Pack a 1-night daypack for Fuji"], "order": 19, "title": "Dec 27 (Sun): Castle + Shinsekai"}, "n20": {"group": "Transport", "lines": ["**Hotel → Shin-Osaka** — Walk 5 min to **Nishi-Ōhashi** → Nagahori line 1 stop → **Shinsaibashi**, change to the **Midōsuji line** → Shin-Osaka. Or walk ~14 min straight to Shinsaibashi · ~35 min door to door, ~¥290, IC. Daypacks only (suitcases went to Tokyo on Dec 27). Buy ekiben at the station", "**Shin-Osaka → Mishima** — **Hikari** (booked Nov 28), arrive by ~9:50 · ~2h, ~¥11,000. Right side for Fuji", "**Mishima → Kawaguchiko** — **Fujikyu limited express bus, 10:20** from **Mishima Stn south exit** → Kawaguchiko Stn **11:50** · ¥2,700, **reserved**. Earlier option: 9:20 → 10:50", "**Station → SEVEN HOUSE** — Walk · ~5 min. ✅ They hold bags before check-in", "**Around the lake** — **E-bikes** (SEVEN HOUSE rents bikes, ask for 4 e-bikes; or a shop by the station) · ~¥3,000–4,000/day, back by ~5pm", "**Bad-weather backup** — **Omni Bus Red Line** (2-day pass ¥2,000) + **Kachi Kachi Ropeway** (¥1,200 return, last down 17:20) · Every ~15 min from the station"], "order": 20, "title": "Dec 28 (Mon): Osaka → Kawaguchiko"}, "n21": {"group": "Transport", "lines": ["**Kawaguchiko → Shimoyoshida** — **Fujikyu train**, ~6:30 (check the first train the night before) · ~13 min, ~¥310, IC. Taxi ~10–15 min if no early train", "**Shimoyoshida → Chureito → Honcho St** — Walk · ~20 min up + 398 steps; Honcho St ~15 min walk back down", "**Shimoyoshida → Kawaguchiko** — Fujikyu train · ~13 min, ~¥310", "**Station ↔ Lawson / SEVEN HOUSE** — Walk · 2–5 min. Collect bags", "**Kawaguchiko → Shinjuku** — **Highway bus ~10:30** (booked ~Nov 29) · ~1h45–2h, ~¥2,200. Arrives Shinjuku Expressway Bus Terminal (Busta), above the station", "**Shinjuku → hotel** — **JR Yamanote** → **Takanawa Gateway**, walk ~9 min · ~25 min, ~¥210, IC", "**Hotel → Asakusa** (coin ring) — **Toei Asakusa line** Sengakuji → Asakusa, direct · ~25 min, ~¥280, IC", "**Asakusa → Kappabashi** — Walk · ~10 min", "**Back to hotel** — Asakusa → Sengakuji, Toei Asakusa line direct · ~25 min"], "order": 21, "title": "Dec 29 (Tue): Fuji → Tokyo"}, "n22": {"group": "Transport", "lines": ["**Hotel → Kamakura** — **Keikyu** Sengakuji → **Shinagawa** (1 stop; walking is ~22 min) → **JR Yokosuka line** → Kamakura, direct · ~50 min, ~¥940, IC", "**Kamakura Stn → Hōkokuji** — **Bus 5** from the east exit → Jōmyōji · ~12 min, ~¥220, IC", "**Hōkokuji → Hachimangu** — Walk ~25 min or bus back", "**Hachimangu → Station** — Walk down **Komachi-dōri** · ~10 min", "**Kamakura → Hase** — **Enoden** · 5 min, ~¥220, IC (day pass ¥800 if riding 3+ times)", "**Hase → Kamakurakōkōmae** — Enoden · ~10 min", "**→ Shichirigahama** — Enoden 1 stop or walk · ~10 min walk", "**Back to Tokyo** — Enoden → Kamakura → JR Yokosuka line → Shinagawa. Or Enoden → **Fujisawa** → JR Tōkaidō line → Shinagawa · ~1h15, ~¥1,200"], "order": 22, "title": "Dec 30 (Wed): Kamakura"}, "n23": {"group": "Transport", "lines": ["**Hotel → Tsukiji** (breakfast) — **Toei Asakusa line** Sengakuji → Higashi-Ginza, walk ~8 min · ~20 min, ~¥220, IC", "**Tsukiji → Shibuya** — **Hibiya line** Tsukiji → Ebisu, JR Yamanote 1 stop → Shibuya · ~30 min, ~¥380, IC", "**Shibuya → Harajuku** — Walk (Cat Street) · ~20 min", "**Harajuku → hotel** — **JR Yamanote** → Takanawa Gateway · ~25 min", "**Hotel → Zōjō-ji** (countdown) — **Toei Asakusa line** Sengakuji → **Daimon** (2 stops), walk ~5 min · ~5 min, ~¥180. Walk home ~35 min if trains are packed"], "order": 23, "title": "Dec 31 (Thu): Shibuya → Harajuku + countdown"}, "n24": {"group": "Transport", "lines": ["**Hotel → Todoroki** — **Keikyu** Sengakuji → **Shinagawa** (1 stop) → **JR Keihin-Tōhoku** 1 stop → **Ōimachi** → **Tokyu Ōimachi line** → Todoroki · ~40 min, ~¥350, IC", "**Todoroki → Skytree** — Ōimachi line → Jiyūgaoka → **Tōyoko line** → Shibuya → **Hanzōmon line** → Oshiage (direct). Or back via Ōimachi → Shinagawa → Toei Asakusa line → Oshiage · ~50–60 min, ~¥500", "**Skytree → hotel** — **Toei Asakusa line** Oshiage → Sengakuji, direct · ~30 min, ~¥280", "**(Alt: Odaiba)** — Toei Asakusa line → Shimbashi → **Yurikamome** → Daiba · ~30 min, ~¥550", "**(Alt: Sunshine City)** — Takanawa Gateway → JR Yamanote → Ikebukuro · ~35 min, ~¥210"], "order": 24, "title": "Jan 1 (Fri): Todoroki Valley → Skytree"}, "n25": {"group": "Transport", "lines": ["**Hotel → Shinjuku** — **Takanawa Gateway → JR Yamanote** → Shinjuku · ~25 min, ~¥210, IC", "**Shinjuku → Yanaka Ginza** — **JR Yamanote** → **Nippori**, walk ~5 min · ~25 min, ~¥210", "**(Alt: Nakano)** — JR Chūō line Shinjuku → Nakano · 5 min, ~¥170", "**Nippori → Kanda (dinner)** — JR Yamanote · ~10 min, ~¥170", "**Kanda → hotel** — JR Yamanote → Takanawa Gateway · ~20 min, ~¥210"], "order": 25, "title": "Jan 2 (Sat): Shinjuku → Yanaka"}, "n26": {"group": "Transport", "lines": ["**Hotel → Akihabara** — **Takanawa Gateway → JR Yamanote/Keihin-Tōhoku** → Akihabara · ~20 min, ~¥210, IC", "**Akihabara → Nihonbashi** — Walk ~20 min, or Ginza line Suehirochō → Mitsukoshimae · ~5 min, ~¥180", "**Nihonbashi → Ginza** — **Ginza line** 2 stops, or walk ~15 min · ~¥180", "**Ginza → Togoshi Ginza** — **Toei Asakusa line** Higashi-Ginza → **Togoshi**, direct · ~20 min, ~¥280", "**Togoshi → hotel** — Toei Asakusa line → Sengakuji (3 stops) · ~8 min, ~¥180"], "order": 26, "title": "Jan 3 (Sun): Akihabara → Nihonbashi → Ginza → Togoshi Ginza"}, "n27": {"group": "Transport", "lines": ["**A (easiest)** — **Sengakuji → Narita Airport, direct** on a Keisei **Access Express** through-train · ~1h30, ~¥1,500, IC. ⚠️ **Check the earliest direct train** the week before; you need to leave by ~05:45", "**B** — **Keikyu** Sengakuji → **Shinagawa** (1 stop) → **Narita Express** · ~1h10, ~¥3,000, reserved seat", "**Backup** — Sengakuji → Asakusa line to Oshiage/Aoto → Keisei to Narita · If no direct train fits"], "order": 27, "title": "Jan 4 (Mon): → Narita, 09:45 flight"}, "n28": {"group": "Transport", "lines": ["**Osaka Amazing Pass 1-day (¥3,500)** — Dec 27 · You do the Castle + Tsūtenkaku + extras", "**Omni Bus 2-day (¥2,000)** — Dec 28–29 · No e-bikes (bad weather)", "**Enoden day pass (¥800)** — Dec 30 · 3+ Enoden rides"], "order": 28, "title": "Passes: only these, only if it fits the day"}, "n29": {"group": "Food", "lines": ["**Kinryu Ramen Dotonbori** ✓ — Cheap pork-bone ramen, free kimchi + garlic · **24 hours**. Buy from the vending machine, it's a quick, simple bowl", "**Osaka Tonkatsu Dotonbori Main Store** ✓ — The viral 5cm-thick tonkatsu · 11:00–21:30. ~10–12 seats, queues 30–90 min. They take your order in the queue. The regular size is already huge", "**Dearbros Omurice** ✓ — Omurice with wagyu / melty pork · 11:00–23:00, Sennichimae. Order first, then they seat you. Medium is big enough to share", "**Strawberry Mania (Dotonbori)** ✓ — Strawberry daifuku, crepes, candied strawberries · 11:00–22:00", "**Takoume Honten** — Old, famous oden shop · **16:00–22:30**. Izakaya rules: 1 drink + 1 small dish minimum. English menu is slightly pricier than the Japanese one", "**Okonomiyaki AT THE 21 Namba** — Big fluffy okonomiyaki + yakisoba, cooked for you · 12:00–22:00 (Mon/Tue may have a 3:30–5:30 break). Book ahead at dinner", "**Teppanyaki (pork jowl)** ✓ — ❓ The list doesn't name the shop. **Teppan Jinja** in Dotonbori (skewers + teppan, 12:00–3:00am) is a likely match. Ask the cousin which one · Teppan Jinja", "**Takoyaki (near the tonkatsu)** — ❓ Unnamed on the list. Lots of stalls around Sennichimae; Kogaryu below is the famous one"], "order": 29, "title": "Dotonbori / Namba (Dec 24 night, Dec 26)"}, "n30": {"group": "Food", "lines": ["**MooKEN** ✓ — Viral caramel-crust cream puffs · **Wed–Sun 11:00–15:00, closed Mon & Tue.** Sells out. Minimum 10 pieces, max 30. Go at 10:30 for a ticket. **Works Dec 25, 26 or 27**", "**Kogaryu Takoyaki** — Classic Amemura takoyaki, try the green onion one · 10:30–20:30. Takeaway, eat in Triangle Park", "**Tsukishima Monja Okoge Shinsaibashi** — Monjayaki + okonomiyaki cooked at your table · 11:00–23:00. 4.9★ from 7,000+ reviews, very group-friendly"], "order": 30, "title": "Shinsaibashi / Amerikamura (5–10 min from the hotel)"}, "n31": {"group": "Food", "lines": ["**Dekasan** (full name: *Konnani Dekai Sandwich wa Hansoku da*, \"a sandwich this big should be illegal\") — also on the friend's list — Huge steak sandos + egg sando · 11:00–18:00. ~10 seats, up to 1h wait to sit. **Order takeaway** and eat in the park next door"], "order": 31, "title": "Nipponbashi / Den-Den Town (Dec 26)"}, "n32": {"group": "Food", "lines": ["**Tempurayasan** — Family-run tempura, locals' lunch spot · **Closed Mon.** Lunch 11:30–13:30, dinner 17:00–21:30. English menu. On the way from Namba to Shinsekai"], "order": 32, "title": "Namba-naka / towards Shinsekai (Dec 27)"}, "n33": {"group": "Food", "lines": ["**Grill Lamp-tei** — Old-school yōshoku: omurice (玉子烧饭), hamburg, fried shrimp · 11:00–22:00. Queues at lunch, they take orders outside. 1 stop from Umeda", "**Harukoma** — Cheap, busy local sushi (see sushi section) · Closed Tue. Same street as Lamp-tei", "**Densuke Tenma (内臓専門デンスケ 天満店)** 👨‍👩‍👧 family pick — Offal yakiniku: big, fresh cuts of tripe, intestine, tongue, skirt steak. Retro Shōwa-era house · **Tue–Sun 17:00–23:00, closed Mon. Reserve** (locals say it's a must for groups). 12-11 Naniwachō, near Tenjinbashisuji 6-chōme Stn. **Good for Dec 25 dinner**"], "order": 33, "title": "Tenjinbashi-suji, Kita (Dec 25, after Katsuoji/Minoh)"}, "n34": {"group": "Food", "lines": ["**\"Oden Fukusushi\"**: there's a **Fuku Sushi** inside Tsuruhashi market (morning sushi, 9:00–15:00, closed Wed, smoking allowed), but that's sushi, not oden. Ask the cousin for the exact place."], "order": 34, "title": "Not sure which one"}, "n35": {"group": "Food", "lines": ["**Kitsuneya** — Tsukiji stall: beef or offal rice bowl, ~¥1,000, standing · 6:30–13:00, **closed Sun & Wed**, Tsukiji shuts ~Jan 1–4 · **Dec 31, 8am**", "**Gyukatsu Motomura Shibuya** — Beef cutlet you sear on a hot stone, 4.9★ · 11:00–22:00. Queue; they take orders in line. Two branches close together · **Dec 31 lunch**", "**Luke's Lobster (Cat Street)** — Lobster roll · 11:00–21:00 (9:00 on weekends) · **Dec 31 snack**", "**Roast Beef Ohno Harajuku** — Roast beef rice bowl, 4.7★ · 11:00–22:00. Go before 12 or after 2 · **Dec 31 afternoon**", "**Spontini Harajuku** — Thick Milan-style pizza · 11:00–21:00 (weekday break 3–5pm) · **Dec 31** (alt. to Ohno)", "**Kizuna Sushi Akihabara** — All-you-can-eat sushi on a tablet, ~¥4,000–5,000 / 2h · 11:00–23:30. Big choice, average quality · **Jan 3 lunch**", "**Ootoya** — Japanese set-meal chain (grilled fish, rice, miso) · Many branches, most open ~11am · Any day, easy lunch", "**Sumatra Curry Kyōeidō** — Old-school dark curry (Jimbocho) · 11:00–20:00, **closed Sun**, likely closed over New Year · ⚠️ Only Dec 29 or 30 evening fits", "**Sushi Dai (Toyosu)** — Famous market sushi, people queue from the early hours · Toyosu closes ~Dec 31–Jan 4 and some Wednesdays · ⚠️ Probably skip (clashes with Kamakura on Dec 30)", "**Yakiniku Kanda Seinikuten (Kanda Butcher Shop)** — Affordable wagyu yakiniku you grill yourself, 4.3★, by Kanda Stn south exit · Mon–Fri 11:00–23:00, **Sat–Sun from 16:00**. Some reviews mention a 10% service charge + ¥380 table charge, so check the bill · **Jan 2 dinner** (10 min from Nippori on the Yamanote)"], "order": 35, "title": "Tokyo (friend's list)"}, "n36": {"group": "Food", "lines": ["**Kyoto Katsugyu** — Beef cutlet chain (same idea as Motomura), several branches in central Kyoto · Dec 22 or 23 dinner, if you'd rather skip the Motomura queue in Tokyo"], "order": 36, "title": "Kyoto"}, "n37": {"group": "Food", "lines": ["Good counters where locals go, with set or per-plate prices instead of a ¥20k course. None take reservations, so expect a queue.", "**Harukoma** — Osaka, Tenjinbashi. **Dec 25 lunch** · Closed Tue. Cheap and fresh, order by number. Shortest queue ~1:30–3pm", "**Kame Sushi Sohonten** — Osaka, Umeda (10 min walk). **Dec 25 dinner** · Old local counter, 2-piece plates, reasonable prices. Queue 15–60 min", "**Endō Sushi (Central Market)** — Osaka, Noda fish market. **Dec 25 or 26 morning** · 6:15–14:00, **closed Sun.** Sets of 5 pieces, top quality for the price. Go early", "**Uogashi Nihon-ichi (Shinagawa Stn)** — Tokyo, inside Shinagawa Stn ticket gates, next to the hotel. **Dec 29 dinner** · Standing sushi bar, fast and cheap (8 pieces ~¥2,000). Also a branch in Gotanda", "**Sushi no Midori (Ginza)** — Tokyo, Ginza. **Jan 3** · Big generous cuts, set plates. Take a queue number and walk around Ginza meanwhile", "⚠️ Many independent sushi shops close ~Dec 30–Jan 4. Station and chain counters (Uogashi Nihon-ichi, Midori) are the most likely to be open, but check before going."], "order": 37, "title": "Local sushi (not fancy omakase)"}, "n38": {"group": "Food", "lines": ["**Dec 20** — Yoroiya ramen (Asakusa), Ginza depachika", "**Dec 22** — Ramen Koji at Kyoto Station, Pontocho dinner", "**Dec 23** — Inari-mae stalls (grilled quail, inari sushi), lunch in Gion", "**Dec 24** — **Nakamura Tokichi** matcha parfait, cha-soba (green tea soba) in Uji", "**Dec 25** — Momiji tempura at Minoh", "**Dec 27** — Kushikatsu Daruma (Shinsekai)", "**Dec 28** — **Hōtō Fudō** (Kawaguchiko)", "**Dec 30** — Shirasu-don (Kamakura)", "**Dec 31** — Toshikoshi soba", "**Jan 2** — **Takano Fruit Parlour** (Shinjuku)", "**Any night** — Wagyu yakiniku buffet (~¥5k–12k pp, chains stay open over New Year)"], "order": 38, "title": "Already in the itinerary"}, "n39": {"group": "Food", "lines": ["✓ Ohayo brûlée ice cream", "✓ Ohayo milk pudding", "✓ FamilyMart pau (nikuman)", "✓ Lawson milk swiss roll", "✓ Seaweed potato chips", "Yogurt", "**Sandi (サンディ)**: discount supermarket, very cheap snacks, drinks, bento. Several Osaka branches (e.g. Isoji, Minato-ku). Cash at some branches"], "order": 39, "title": "Convenience store"}, "n40": {"group": "Food", "lines": ["✓ Pistachio chocolate", "✓ Mintia candy"], "order": 40, "title": "Don Quijote"}, "n41": {"group": "Bookings", "lines": ["**1** — **Kawaguchiko hotel** — ✅ SEVEN HOUSE, Funatsu 3487-5 · Dec 28 (1 night) · Booked · ✅ · **Only hotel left.** Stay near Kawaguchiko Stn / east shore. Dec 28 = start of New Year holidays, Fuji-view rooms go fast", "**2** — **DisneySea tickets** — ✅ bought · Dec 21 · Official Tokyo Disney Resort site / app · ✅ · Dated tickets, sale opens ~2 months ahead, so around now. 4 tickets, link everyone in the app", "**3** — **Kimono rental, Kyoto** · Dec 23, ~10:00 · Rental shop website (pick one near Kiyomizu / Higashiyama) · ❌ · Holiday season, book 1–2 weeks ahead at least. Check return time is ~4:30pm or later"], "order": 41, "title": "Book NOW (open already, sells out)"}, "n42": {"group": "Bookings", "lines": ["**3a** — **Coin ring workshop, Asakusa** (ENNE RING) · Dec 29, ~3pm · Klook / shop site · ~1h, ~¥2,700 pp, English OK. Check they're open Dec 29 and take 4 people at once", "**3b** — **Matcha in Uji** (optional) · Dec 24, ~11am · Taihō-an: walk-in, ¥500 · Fukujuen Uji Kōbō: call 050-3152-2930, ¥2,200 · Both cheap. Taihō-an = quick tea ceremony, Fukujuen = grind your own on a stone mill", "**3c** — **Chopstick-making workshop, Higashi-Shinsaibashi** (optional) · Dec 26, ~2pm · Cookly / Klook · ~1h, ~US$33 (~¥5,000) pp, English, up to 4 per group, slots 10am–4pm. Cheaper options: Hashi Lab by Kyoto Stn ~US$26, Tokyo ~US$15"], "order": 42, "title": "Book soon (workshops)"}, "n43": {"group": "Bookings", "lines": ["**4** — **Nov 22, 10:00 JST (9:00 MYT)** · Shinkansen **Tokyo → Kyoto** · Dec 22, ~10:30 Nozomi · smartEX app · 4 seats together, reserved. If any suitcase is 160cm+, pick the oversized-baggage seats (last row, free)", "**5** — **Nov 28, 10:00 JST (9:00 MYT)** · Shinkansen **Shin-Osaka → Mishima** · Dec 28, Hikari **arriving Mishima by ~9:50** · smartEX app · ⚠️ **Hikari, not Nozomi** (Nozomi skips Mishima). Right side (seat E) for Fuji", "**6** — **~Nov 29** (≈1 month ahead) · Highway bus **Kawaguchiko → Shinjuku** · Dec 29, ~10:30 · highwaybus.com · Holiday slots sell out. Book as soon as it opens", "**7** — **When it opens (~Nov 28)** · Bus **Mishima → Kawaguchiko** · Dec 28, **10:20** → 11:50 (¥2,700) · Fujikyu online booking · **Seat reservation required.** Online is cheaper than at the counter. Earlier bus 9:20 → 10:50"], "order": 43, "title": "Book on a specific date (sales open then)"}, "n44": {"group": "Bookings", "lines": ["**8** — **Smile Hotel Shinagawa Sengakuji Ekimae** · Hold luggage forwarded from Osaka before our Dec 29 check-in · ✅ Yes", "**9** — **Tokyo Bay stay, Urayasu** · Will you accept luggage sent by Yamato from Narita on Dec 20 before check-in? · ❌", "**10** — **SEVEN HOUSE, Kawaguchiko** · Hold bags before check-in ✅ yes. Still to ask: **4 e-bikes** for Dec 28 afternoon (price, return time)? Leave bags after checkout Dec 29 until ~9:30? Fuji-view room? · ⏳"], "order": 44, "title": "Confirm with hotels (email)"}, "n45": {"group": "Bookings", "lines": ["**11** — ~1 month ahead · **E-bikes × 4, Kawaguchiko** (Dec 28 afternoon) · Ask SEVEN HOUSE first (on-site rental), else a shop by Kawaguchiko Stn · Reserving 4 bikes on a holiday is safer. Free cancel if weather is bad? Check", "**12** — ~31 days ahead (check site) · **Pokémon Cafe Osaka** · Pokémon Cafe official site · Slots go in minutes", "**14** — ~2–4 weeks ahead · **Shibuya Sky** sunset slot · Official site · Tokyo days still to plan", "**15** — Anytime · **teamLab Planets** (only if you change your mind) · Official site · ~¥3,600+ pp, more on holidays. Not in the plan", "**16** — 1–2 weeks ahead · **Dinner, Pontocho** (Dec 22 or 23) · Tabelog / Google / restaurant · Walk-in is fine for casual spots; book if you want a nicer place for 4", "**17** — Anytime · **Osaka Amazing Pass 1-day** (¥3,500) · Online or in Osaka · Only for Dec 27 (Castle + Tsutenkaku + river cruise)", "**18** — Day before is fine · **Narita Express** reserved seats · JR East / station · Only if you pick Option B for Jan 4 (Shinagawa → Narita)", "**19** — 1–2 months ahead (good counters) · **Sushi omakase** — lunch ¥5k–15k pp, dinner ¥15k–30k pp, top counters ¥30k+ · OMAKASE / Pocket Concierge / TableCheck, or ask the hotel to call · Lunch = same fish for much less. Card guarantee + no-show fee is normal. ⚠️ Most counters close ~Dec 30–Jan 4 (Toyosu market too), so aim for Osaka Dec 25–27 or Tokyo Dec 29", "**20** — 1–2 weeks ahead · **Wagyu yakiniku all-you-can-eat** — ~¥5k–12k pp, 90–120 min, drinks +¥1.5k–2.5k · Klook / Trip.com / Tabelog / TableCheck · Check it says **kuroge wagyu** (Japanese black beef). Cheaper chains (Gyukaku, Yakiniku King) are ~¥3.5k–5.5k but mostly not wagyu. Osaka is a good place for it", "Amounts in RM, paid or not. Exchange rate used: **¥100 = RM 2.59** (Wise mid-market, Nov 2). **Shopping is not included.**"], "order": 45, "title": "Optional — only if the group wants it"}, "n46": {"group": "Bookings", "lines": ["**Tokyo Disney side, Dec 20–22** — 590.00 · You + gf · 590.00 · own booking (not included)", "**Kyoto, Dec 22–24** — 271.24 · You + gf · 271.24 · own booking (not included)", "**Osaka, Dec 24–28** — 1,217.00 · All 4 · 608.50 · 608.50", "**Kawaguchiko (SEVEN HOUSE), Dec 28–29** — 618.00 · All 4 · 309.00 · 309.00", "**Tokyo (Smile Hotel), Dec 29–Jan 4** — 4,892.81 · All 4 · 2,446.41 · 2,446.41", "**Total** — **7,589.05** · **4,225.15** · **3,363.91**", "**Per person** — **2,112.57** · **1,681.96** + their own Tokyo/Kyoto stays"], "order": 46, "title": "Hotels (paid / booked)"}, "n47": {"group": "Bookings", "lines": ["**Transport**: Nozomi ~¥14,200 + Hikari ~¥11,500 + Fuji buses ¥4,900 + Narita both ways ~¥2,900 + city trains/taxis/e-bike ~¥25,000 — ~58,000 · ~1,500", "**Activities**: Disney Premier Access ~¥7,500, kimono ~¥5,000, temples/entries ~¥7,500, coin ring ¥2,700, matcha ¥500, Yamato luggage ×2 ~¥4,500 — ~28,000 · ~720", "**Food**: ~¥6,000/day × 16 days (konbini breakfast + 2 meals + snacks; the yakiniku/wagyu nights cost more, konbini days less) — ~100,000 · ~2,590", "**Subtotal** — **~186,000** · **~4,810**", "**Optional extras: chopstick workshop ¥5,000, Skytree deck ~¥3,500, Spa World ~¥1,500, Abeno Harukas ¥2,000** — ~12,000 · ~310"], "order": 47, "title": "On the trip (estimate, per person)"}, "n48": {"group": "Bookings", "lines": ["**You + gf (2 tickets)** — 576.80 → **288.40 pp**", "**Friends** — assumed the same, 288.40 pp"], "order": 48, "title": "DisneySea tickets"}, "n49": {"group": "Bookings", "lines": ["**You / gf** — 2,112.57 · 288.40 · ~4,810 · **~7,211** · **~14,422 for the two of you**", "**Each friend** — 1,681.96 + own Dec 20–24 hotels · 288.40 · ~4,810 · **~6,780** + own hotels · **~13,560 for both** + own hotels"], "order": 49, "title": "Total per person (before flights & shopping)"}, "n50": {"group": "Bookings", "lines": ["RM 8,604 for **you + gf** (KUL ⇄ NRT) → **RM 4,302 pp**. Friends' flights not known."], "order": 50, "title": "Flights"}, "n51": {"group": "Bookings", "lines": ["**You / gf** — **~RM 11,513** · **~RM 23,026** for the two of you", "**Each friend** — **~RM 6,780** + own flights + own Dec 20–24 hotels · **~RM 13,560** for both + flights + own hotels", "Shopping on top. Cash you actually spend in Japan is only the \"Trip\" part: ~¥186,000 (~RM 4,810) pp.", "Shopping (Pokémon cards, lucky bags, Uniqlo, Don Quijote) comes on top. Set your own number for it."], "order": 51, "title": "Grand total (everything except shopping)"}, "n52": {"group": "Bookings", "lines": ["**Card works for:** hotels, shinkansen + buses (booked online), department stores, Uniqlo, Don Quijote, Pokémon Centers, chains, konbini, most restaurants.", "**Cash is needed for:**", "**Topping up the physical IC cards.** Station machines take cash only. Expect ~¥20,000–25,000 pp over the trip.", "Temple entries, market stalls (Kitsuneya, takoyaki), small ramen/vending-machine shops, coin lockers, some buses.", "Rough cash need: **~¥55,000–60,000 per person** (~RM 1,450–1,550).", "**RM 2,000 for two (≈ ¥77,000)** covers about **half** of that. Two ways to handle it:", "1. **Bring ~RM 3,000 for two (≈ ¥115,000).** That's enough for the whole trip.", "2. **Bring RM 2,000** and top up with a **Wise / BigPay card at a 7-Eleven ATM** (works 24/7, low fees). Do it **before Dec 31**, since Japan Post ATMs go offline over New Year."], "order": 52, "title": "Cash vs card"}, "n53": {"group": "Bookings", "lines": ["**Japanese yen cash** — ~¥55–60k pp · See the 💰 Budget section. Top up at 7-Eleven ATMs before Dec 31", "**Low-FX card** (Wise / BigPay / similar) — Free–small fee · For hotels, big stores, restaurants", "**eSIM or pocket wifi** — ~RM30–80 pp · For 17 days. Pocket wifi = 1 device shared by 4, but you all have to stay together", "**Travel insurance** — Varies · Covers delays, medical, lost bags", "**Plug adapter** (Malaysia Type G → Japan Type A) — ~RM10–20 · Japan is 100V; phone/laptop chargers are fine", "**Warm gear** — Gloves, beanie, windproof jacket, thermal layer. Fuji drops to around -5°C", "**Tell your bank** you're travelling — Avoids card blocks", "**Visit Japan Web** — Free · Fill in a few days before Dec 19, screenshot the QR codes", "**Hotel addresses in Japanese** — Screenshot them for taxis and Yamato forms", "**1-night daypack** for Fuji — Suitcases go Osaka → Tokyo on Dec 27", "**Apps** (free) — See the 📱 Apps section below"], "order": 53, "title": "Before you fly (in Malaysia)"}, "n54": {"group": "Bookings", "lines": ["**IC card × 4** (Suica / Pasmo / Welcome Suica) — **Dec 20, Narita B1** on arrival · Load ~¥3,000 to start · **One each.** Physical card (Android). Welcome Suica = tourist version, no deposit, valid 28 days. Top up with cash at station machines. Works in Kyoto, Osaka, Fuji too, plus konbini & vending machines", "**Keisei Sky Access** Narita → Asakusa — Dec 20, airport · ~¥1,450 pp · Can tap your IC card", "**Omni Bus 2-day pass**, Kawaguchiko — Dec 28, Kawaguchiko Stn · ¥2,000 pp · Only if you're not biking / as weather backup. Covers Dec 29 too", "**Osaka Amazing Pass 1-day** (optional) — Before Dec 27 · ¥3,500 pp · Only worth it on the Dec 27 Castle/Shinsekai day", "**Enoden day pass** (Kamakura, optional) — On the day · ¥800 pp · Only if riding the Enoden 3+ times"], "order": 54, "title": "In Japan — cards & passes"}, "n55": {"group": "Bookings", "lines": ["**Yamato luggage forwarding** — Dec 20 (Narita → Urayasu), Dec 27 (Osaka → Smile Hotel) · ~¥2,000–2,500 per bag, each time · Pay at the counter / front desk", "**Disney Premier Access** — Dec 21, in the app after entry · ~¥7,500 pp (≈3 rides) · Can't buy before entering the park", "**Kimono rental** — Dec 23 · ~¥3,000–6,000 pp · Depends on the plan; booked in advance", "**E-bike rental** — Dec 28, Kawaguchiko · ~¥3,000–4,000 pp · Return by ~5pm", "**Kachi Kachi Ropeway** (weather backup) — Dec 28 · ¥1,200 pp · Last ride down 17:20", "**Ekiben** (train bento) — Dec 28, Shin-Osaka · ~¥1,000–1,500 pp · Breakfast on the shinkansen", "**Taxis** (split 4 ways) — Katsuoji (Dec 25), Chureito backup (Dec 29) · ~¥500–1,500 pp per ride · Cheaper than it sounds once split", "**Coin lockers** — Kyoto Stn (Dec 24), Kawaguchiko (Dec 28) · ~¥400–700 per locker · Big lockers fill up early", "**Temple / sight entry fees** — Throughout · ~¥300–1,200 each · Many small ones are cash only", "Not many. About **6 must-haves**, the rest only if you'll use them."], "order": 55, "title": "In Japan — pay as you go (budget for these)"}, "n56": {"group": "Bookings", "lines": ["**Google Maps** — Trains, walking, bus times, opening hours, toilets · Best all-rounder in Japan. Download offline maps for Tokyo/Kyoto/Osaka/Fuji as backup", "**Visit Japan Web** (website, not an app) — Immigration + customs QR codes for arrival · Fill in **before Dec 19**, screenshot the QR codes. One account each (or one person registers family/companions)", "**smartEX** — Shinkansen tickets · Nov 22 + Nov 28 bookings", "**Tokyo Disney Resort** — DisneySea tickets, Premier Access, wait times · Link all 4 tickets in one phone", "**Google Translate** — Camera translate menus, signs, packaging · Download Japanese offline", "**GO** (taxi) — Call taxis, pay in app with a foreign card · Handy for Katsuoji (Dec 25) and the Chureito sunrise backup (Dec 29). Uber also works in Tokyo/Kyoto/Osaka"], "order": 56, "title": "Apps: must-have"}, "n57": {"group": "Bookings", "lines": ["**Tabelog** — Japan's own restaurant rating site · Locals use it. **3.5+ is very good** (scores run low). Google reviews lean tourist-heavy, so check both", "**TableCheck** / **Omakase** — Restaurant reservations in English · Only if you want to book a nicer dinner (e.g. Pontocho)", "**Google Maps** — \"Open now\" + queue times (Popular times graph) · Use it to dodge peak hours"], "order": 57, "title": "Apps: food"}, "n58": {"group": "Bookings", "lines": ["**Klook** — Coin ring workshop, attraction tickets, often cheaper than the door · Already using it for the ring", "**Store tourist coupons** (no app) — Don Quijote, Bic Camera, Yodobashi, Matsumoto Kiyoshi often have foreigner coupons (extra few % off) · Google \"[store] tourist coupon\" and show the QR at the till. These may change with the new tax system"], "order": 58, "title": "Apps: discounts & tickets"}, "n59": {"group": "Bookings", "lines": ["From **Nov 1, 2026** Japan changed the tax-free system: you **pay full price incl. 10% tax**, show your passport at the shop (min ¥5,000), and **customs at Narita checks it before you leave**, then refunds to your card/bank later. Keep all tax-free items + receipts together, and do the customs check **before** checking your suitcase. Details in the Jan 4 section of the itinerary."], "order": 59, "title": "Tax refund (no app needed)"}, "n60": {"group": "Bookings", "lines": ["**ecbo cloak** — Book luggage storage in shops/cafés · Backup for when station lockers are full: **Kyoto Stn Dec 24**, **Kawaguchiko Dec 28**", "**Coin Locker Navi** (website) — Find coin lockers + sizes at stations · Big lockers go first, arrive early", "**mymizu** — Free water refill spots · Honestly optional: tap water is safe and vending machines are everywhere", "**Safety tips** (by JNTO) — Earthquake/tsunami/weather alerts in English · Official, free, worth having", "**tenki.jp** or **Windy** — Weather + snow forecast · Check Fuji cloud cover the night before Dec 28/29", "**LINE** — Some cafés/queues/hotels use LINE · Only if a place asks", "**Your eSIM app** — Activate data · Activate on landing, not before", "**Wise / BigPay** — Card controls, FX rate · Whatever card you're bringing", "Skip: **Navitime** (Google Maps covers it), **PayPay / Suica app** (hard to set up for tourists, and you're on Android with physical IC cards anyway)."], "order": 60, "title": "Apps: nice-to-have"}, "n61": {"group": "Bookings", "lines": ["**IC card (Suica/Pasmo)** — Buy at Narita B1 on arrival (Android, so physical card)", "**Disney Premier Access** — Can only be bought in the app after entering the park. Buy Frozen first", "**Yamato luggage forwarding** — Done at the airport counter / hotel front desk", "**Kachi Kachi Ropeway** — Walk up, ¥1,200 return, last ride down 17:20", "**Omni Bus (Kawaguchiko)** — Pay on board or buy the 2-day pass (¥2,000)", "**Fujikyu train to Chureito** — IC card", "**Temples, markets, Uji, Minoh, Katsuoji** — Pay at the gate (Katsuoji: check bus/taxi from Minoh)"], "order": 61, "title": "No advance booking needed (do on the day)"}}, "tasks": {"t00": {"detail": "All 5 stays booked", "done": true, "due": "", "group": "Booked", "order": 0, "text": "Hotels: Urayasu, Kyoto, Osaka, SEVEN HOUSE, Smile Hotel"}, "t01": {"detail": "Link all 4 in the Tokyo Disney Resort app", "done": true, "due": "", "group": "Booked", "order": 1, "text": "DisneySea tickets (Dec 21)"}, "t02": {"detail": "Confirmed", "done": true, "due": "", "group": "Booked", "order": 2, "text": "Smile Hotel + SEVEN HOUSE hold bags before check-in"}, "t03": {"detail": "Near Kiyomizu/Higashiyama. Return time ~4:30pm or later", "done": false, "due": "This week", "group": "Book now", "order": 3, "text": "Kimono rental, Kyoto (Dec 23, ~10am)"}, "t04": {"detail": "ENNE RING via Klook, ~¥2,700 pp. Check 4 people at once", "done": false, "due": "This week", "group": "Book now", "order": 4, "text": "Coin ring workshop, Asakusa (Dec 29, 3:00–3:30pm)"}, "t05": {"detail": "", "done": false, "due": "This week", "group": "Book now", "order": 5, "text": "Travel insurance"}, "t06": {"detail": "Offal yakiniku, family pick. Reservation needed. Closed Mon", "done": false, "due": "Soon", "group": "Book now", "order": 6, "text": "Densuke Tenma, Dec 25 dinner"}, "t07": {"detail": "~¥5,000 pp, up to 4 per group", "done": false, "due": "Optional", "group": "Book now", "order": 7, "text": "Chopstick workshop, Shinsaibashi (Dec 26, 2pm) — optional"},     if(log){ try{ const me=myPerson(); S.db.collection("audit").add({at:Date.now(),uid:S.myId||null,who:me?me.name:mname(S.member),a:String(log[0]||""),t:String(log[1]||"").slice(0,200)}).catch(()=>{}); }catch(e){} }
    return true}
  catch(e){
    if(e&&(e.code==="permission-denied"||e.code==="invalid_argument")){toast(S.canWrite?"You don't have permission for that":"Travelers can view only")}
    else if(e&&e.code==="quota_exceeded") toast("Storage is full. Delete some old entries.");

}
